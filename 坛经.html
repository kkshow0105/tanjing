说：“你观照自心，不要执着外境外相。佛法本来是没有四乘之分的，是因为人自己心中有等差。能够听讲佛经并转而念诵的是小乘法，解说佛法义理的是中乘法，依照佛法修行的是大乘法。一切教法都能通达，一切教法都自具备，一切都不被沾染，超离一切法相，且一无所得，这叫作最上乘。乘是修行的意思，不在于口头上争论，你需要自己修行，不要问我了。时时刻刻，自我本性如如不动。”","origSents":["师曰：“汝观自本心，莫著外法相。","法无四乘，人心自有等差。","见闻转诵是小乘，悟法解义是中乘，依法修行是大乘。","万法尽通，万法俱备，一切不染，离诸法相，一无所得，名最上乘。","乘是行义，不在口争，汝须自修，莫问吾也。","一切时中，自性自如。","”"]},{"orig":"常礼谢执侍，终师之世。","trans":"智常礼拜致谢并从此侍奉惠能大师直至去世。","origSents":["常礼谢执侍，终师之世。"]},{"orig":"僧志道，广州南海人也。请益曰：“学人自出家，览《涅槃经》十载有余，未明大意，愿和尚垂诲。”","trans":"僧人志道，广州南海人。向惠能大师请教：“弟子自从出家以来，阅读《涅槃经》已经有十多年了，都没有明白经文大意，希望大师给予教诲。”","origSents":["僧志道，广州南海人也。","请益曰：“学人自出家，览《涅槃经》十载有余，未明大意，愿和尚垂诲。","”"]},{"orig":"师曰：“汝何处未明？”","trans":"惠能大师问：“你是哪里不明白？”","origSents":["师曰：“汝何处未明？","”"]},{"orig":"曰：“‘诸行无常，是生灭法；生灭灭已，寂灭为乐。’于此疑惑。”","trans":"志道说：“经中有这一句，‘诸行无常，是生灭法；生灭灭已，寂灭为乐’。我对这一句疑惑不解。”","origSents":["曰：“‘诸行无常，是生灭法；","生灭灭已，寂灭为乐。","’于此疑惑。","”"]},{"orig":"师曰：“汝作么生疑？”","trans":"惠能大师说：“你有什么疑惑？”","origSents":["师曰：“汝作么生疑？","”"]},{"orig":"曰：“一切众生皆有二身，谓色身法身也。色身无常，有生有灭；法身有常，无知无觉。经云：生灭灭已，寂灭为乐者，不审何身寂灭？何身受乐？若色身者，色身灭时，四大分散，全然是苦，苦不可言乐。若法身寂灭，即同草木瓦石，谁当受乐？又法性是生灭之体，五蕴是生灭之用；一体五用，生灭是常。生则从体起用，灭则摄用归体。若听更生，即有情之类，不断不灭。若不听更生，则永归寂灭，同于无情之物。如是，则一切诸法被涅槃之所禁伏，尚不得生，何乐之有？”","trans":"志道说：“一切众生都有色身法身这二身。色身是变化的，有生也有死；法身是永恒的，无知也无觉。佛经上说：生灭灭已，寂灭为乐，我不知道是哪一个身寂灭？哪一个身受乐？如果是色身，那么色身坏灭的时候，由地、水、火、风四大和合组成的色身全部分散了，这是苦，既然苦就不可以说是乐。如果法身寂灭，就如同草木瓦石一样，谁来承当受乐呢？另外，法性是生灭的本体，五蕴是生灭的功用；一个主体五种功用，生灭应该是永恒不变的。生就是从本体中生起作用，灭就是摄这五种用而归还法。如果听任其再生，那么所有有情，不会断灭。如果不任其再生，那就永远归于寂灭，等同于草木瓦石等无情之物。这样，那么一切法都被涅槃禁伏，尚且不能得再生，又有什么乐处呢？”","origSents":["曰：“一切众生皆有二身，谓色身法身也。","色身无常，有生有灭；","法身有常，无知无觉。","经云：生灭灭已，寂灭为乐者，不审何身寂灭？","何身受乐？","若色身者，色身灭时，四大分散，全然是苦，苦不可言乐。","若法身寂灭，即同草木瓦石，谁当受乐？","又法性是生灭之体，五蕴是生灭之用；","一体五用，生灭是常。","生则从体起用，灭则摄用归体。","若听更生，即有情之类，不断不灭。","若不听更生，则永归寂灭，同于无情之物。","如是，则一切诸法被涅槃之所禁伏，尚不得生，何乐之有？","”"]},{"orig":"师曰：“汝是释子，何习外道断常邪见，而议最上乘法？据汝所说，即色身外别有法身，离生灭求于寂灭。又推涅槃常乐，言有身受用。斯乃执吝生死，耽著世乐。汝今当知佛为一切迷人，认五蕴和合为自体相，分别一切法为外尘相，好生恶死，念念迁流，不知梦幻虚假，枉受轮回，以常乐涅槃，翻为苦相，终日驰求。佛愍此故，乃示涅槃真乐，刹那无有生相，刹那无有灭相，更无生灭可灭，是则寂灭现前。当现前时，亦无现前之量，乃谓常乐。此乐无有受者，亦无不受者，岂有一体五用之名？何况更言涅槃禁伏诸法，令永不生，斯乃谤佛毁法。听吾偈。”曰：","trans":"惠能大师说：“你是佛门弟子，怎么学习外道断灭和永恒的那类偏见，并以此来议论最上乘佛法？根据你所说的，就是说色身之外还有法身，超离生灭，求得寂灭。又说涅槃常乐，都是说有一个身在受用。你这乃是执着于生死，沉迷于世间享乐。你现在应该知道，一切执迷的人，都把五蕴和合作为自体的实相，区分一切法为外在现象，贪求生存，厌恶死亡，不知道世间一切都是梦幻虚假，徒劳无益，空受轮回，反而把永恒极乐的涅槃认作为苦相，整天追逐寻求世俗欲念。佛正是由于怜悯他们的原故，才显示涅槃的真正极乐，瞬间没有了生的相状，瞬间没有了灭的相状，更没有生灭这个相状可以灭，则真正的寂灭出现在眼前。即便当它出现眼前时，也没有‘出现’这个量显现，这叫作常乐。这个乐没有承受者，也没有不承受者，哪里有所谓的一个本体五种功用的说法？何况还说涅槃禁伏住了一切万法，使这些一切永远不得再生，这实在是诽谤佛，毁谤佛法。听我的偈吧。”偈说：","origSents":["师曰：“汝是释子，何习外道断常邪见，而议最上乘法？","据汝所说，即色身外别有法身，离生灭求于寂灭。","又推涅槃常乐，言有身受用。","斯乃执吝生死，耽著世乐。","汝今当知佛为一切迷人，认五蕴和合为自体相，分别一切法为外尘相，好生恶死，念念迁流，不知梦幻虚假，枉受轮回，以常乐涅槃，翻为苦相，终日驰求。","佛愍此故，乃示涅槃真乐，刹那无有生相，刹那无有灭相，更无生灭可灭，是则寂灭现前。","当现前时，亦无现前之量，乃谓常乐。","此乐无有受者，亦无不受者，岂有一体五用之名？","何况更言涅槃禁伏诸法，令永不生，斯乃谤佛毁法。","听吾偈。","”曰："]},{"orig":"无上大涅槃，圆明常寂照。","trans":"无上大涅槃，圆明常寂照。","origSents":["无上大涅槃，圆明常寂照。"]},{"orig":"凡愚谓之死；外道执为断；","trans":"凡愚谓之死；外道执为断；","origSents":["凡愚谓之死；","外道执为断；"]},{"orig":"诸求二乘人，目以为无作；","trans":"诸求二乘人，目以为无作；","origSents":["诸求二乘人，目以为无作；"]},{"orig":"尽属情所计，六十二见本。","trans":"尽属情所计，六十二见本。","origSents":["尽属情所计，六十二见本。"]},{"orig":"妄立虚假名，何为真实义？","trans":"妄立虚假名，何为真实义？","origSents":["妄立虚假名，何为真实义？"]},{"orig":"惟有过量人，通达无取舍。","trans":"惟有过量人，通达无取舍。","origSents":["惟有过量人，通达无取舍。"]},{"orig":"以知五蕴法，及以蕴中我，","trans":"以知五蕴法，及以蕴中我，","origSents":["以知五蕴法，及以蕴中我，"]},{"orig":"外现众色象，一一音声相，","trans":"外现众色象，一一音声相，","origSents":["外现众色象，一一音声相，"]},{"orig":"平等如梦幻，不起凡圣见；","trans":"平等如梦幻，不起凡圣见；","origSents":["平等如梦幻，不起凡圣见；"]},{"orig":"不作涅槃解，二边三际断。","trans":"不作涅槃解，二边三际断。","origSents":["不作涅槃解，二边三际断。"]},{"orig":"常应诸根用，而不起用想；","trans":"常应诸根用，而不起用想；","origSents":["常应诸根用，而不起用想；"]},{"orig":"分别一切法，不起分别想。","trans":"分别一切法，不起分别想。","origSents":["分别一切法，不起分别想。"]},{"orig":"劫火烧海底，风鼓山相击，","trans":"劫火烧海底，风鼓山相击，","origSents":["劫火烧海底，风鼓山相击，"]},{"orig":"真常寂灭乐，涅槃相如是。","trans":"真常寂灭乐，涅槃相如是。","origSents":["真常寂灭乐，涅槃相如是。"]},{"orig":"吾今强言说，令汝舍邪见，","trans":"吾今强言说，令汝舍邪见，","origSents":["吾今强言说，令汝舍邪见，"]},{"orig":"汝勿随言解，许汝知少分。","trans":"汝勿随言解，许汝知少分。","origSents":["汝勿随言解，许汝知少分。"]},{"orig":"志道闻偈大悟，踊跃作礼而退。","trans":"志道听了偈后大彻大悟，欢喜踊跃，行礼退下了。","origSents":["志道闻偈大悟，踊跃作礼而退。"]},{"orig":"行思禅师，生吉州安城刘氏，闻曹溪法席盛化，径来参礼。","trans":"行思禅师，生于吉州安城刘氏家中，听说曹溪惠能大师流布佛法，影响广大，就直接来参拜惠能大师。","origSents":["行思禅师，生吉州安城刘氏，闻曹溪法席盛化，径来参礼。"]},{"orig":"遂问曰：“当何所务，即不落阶级？”","trans":"行思禅师便问：“应当怎么做，就不会落入有阶级的渐修？”","origSents":["遂问曰：“当何所务，即不落阶级？","”"]},{"orig":"师曰：“汝曾作什么来？”","trans":"惠能大师说：“你曾经做什么呢？”","origSents":["师曰：“汝曾作什么来？","”"]},{"orig":"曰：“圣谛亦不为。”","trans":"行思禅师说：“我连圣谛也不修。”","origSents":["曰：“圣谛亦不为。","”"]},{"orig":"师曰：“落何阶级？”","trans":"惠能大师说：“那落到哪个阶级了？”","origSents":["师曰：“落何阶级？","”"]},{"orig":"曰：“圣谛尚不为，何阶级之有？”","trans":"行思禅师说：“连圣谛都不修，哪还会有什么阶级存在？”","origSents":["曰：“圣谛尚不为，何阶级之有？","”"]},{"orig":"师深器之，令思首众。一日，师谓曰：“汝当分化一方，无令断绝。”","trans":"惠能大师十分器重他，让行思做了首座。一天，惠能大师说：“你应当单独教化一方，不要让佛法断绝。”","origSents":["师深器之，令思首众。","一日，师谓曰：“汝当分化一方，无令断绝。","”"]},{"orig":"思既得法，遂回吉州青原山，弘法绍化。谥弘济禅师。","trans":"行思领受了教法，就回到吉州青原山，弘传佛法，广为教化。谥弘济禅师。","origSents":["思既得法，遂回吉州青原山，弘法绍化。","谥弘济禅师。"]},{"orig":"怀让禅师，金州杜氏子也。初谒嵩山安国师，安发之曹溪参扣。让至礼拜。","trans":"怀让禅师，金州杜氏的儿子。最初拜嵩山慧安国师，慧安国师让他到曹溪山来参拜惠能大师。怀让禅师来到曹溪山并礼拜惠能大师。","origSents":["怀让禅师，金州杜氏子也。","初谒嵩山安国师，安发之曹溪参扣。","让至礼拜。"]},{"orig":"师曰：“甚处来？”","trans":"惠能大师说：“从哪里来？”","origSents":["师曰：“甚处来？","”"]},{"orig":"曰：“嵩山。”","trans":"怀让禅师说：“嵩山。”","origSents":["曰：“嵩山。","”"]},{"orig":"师曰：“什么物，恁么来？”","trans":"惠能大师说：“是什么东西，怎么来的？”","origSents":["师曰：“什么物，恁么来？","”"]},{"orig":"曰：“说似一物即不中。”","trans":"怀让禅师说：“说像一个东西就不是了。”","origSents":["曰：“说似一物即不中。","”"]},{"orig":"师曰：“还可修证否？”","trans":"惠能大师说：“还可以修行证悟吗？”","origSents":["师曰：“还可修证否？","”"]},{"orig":"曰：“修证即不无，污染即不得。”","trans":"怀让禅师说：“修行证悟就不是无，受到浸染就不可得了。”","origSents":["曰：“修证即不无，污染即不得。","”"]},{"orig":"师曰：“只此不污染，诸佛之所护念。汝既如是，吾亦如是。西天般若多罗谶：‘汝足下出一马驹，踏杀天下人。’应在汝心，不须速说！”","trans":"惠能大师说：“具有不受污染这一点，是所有佛所共同护念的。你就是这样，我也是这样。西天竺的般若多罗法师曾经预言：‘在你的门下将要出现一匹小马驹，他的智慧可以征服天下人。’这个预言将应证在你身上，等待时机，不必过早地说出来！”","origSents":["师曰：“只此不污染，诸佛之所护念。","汝既如是，吾亦如是。","西天般若多罗谶：‘汝足下出一马驹，踏杀天下人。","’应在汝心，不须速说！","”"]},{"orig":"让豁然契会，遂执侍左右一十五载，日臻玄奥。后往南岳，大阐禅宗。","trans":"怀让豁然契悟，便侍奉惠能大师身边十五年，越来越修证到玄妙深奥的境界。后来去了南岳衡山，大力阐扬禅宗。","origSents":["让豁然契会，遂执侍左右一十五载，日臻玄奥。","后往南岳，大阐禅宗。"]},{"orig":"永嘉玄觉禅师，温州戴氏子，少习经论，精天台止观法门。因看《维摩经》，发明心地。偶师弟子玄策相访，与其剧谈，出言暗合诸祖。","trans":"永嘉玄觉禅师，温州戴氏的儿子，小时候学习经论，精通天台宗的止观教义。因为看了《维摩经》，认识了自心本性。偶然，惠能大师的弟子玄策来访，和他大谈佛理，永嘉玄觉所说的话都与佛祖的真义隐隐相合。","origSents":["永嘉玄觉禅师，温州戴氏子，少习经论，精天台止观法门。","因看《维摩经》，发明心地。","偶师弟子玄策相访，与其剧谈，出言暗合诸祖。"]},{"orig":"策云：“仁者得法师谁？”","trans":"玄策说：“你师从何人而得法？”","origSents":["策云：“仁者得法师谁？","”"]},{"orig":"曰：“我听方等经论，各有师承。后于《维摩经》，悟佛心宗，未有证明者。”","trans":"永嘉玄觉说：“我听大乘经典，都各有师承关系。后来在读《维摩经》时，开悟佛心宗，还没有得到人印证我的见解。”","origSents":["曰：“我听方等经论，各有师承。","后于《维摩经》，悟佛心宗，未有证明者。","”"]},{"orig":"策云：“威音王已前即得，威音王已后，无师自悟，尽是天然外道。”","trans":"玄策说：“在威音王佛以前，无师自通是可以的，在威音王佛之后，没有师承传授而自我开悟，自然全部是外道。”","origSents":["策云：“威音王已前即得，威音王已后，无师自悟，尽是天然外道。","”"]},{"orig":"曰：“愿仁者为我证据。”","trans":"永嘉玄觉说：“希望你能为我印证。”","origSents":["曰：“愿仁者为我证据。","”"]},{"orig":"策云：“我言轻，曹溪有六祖大师，四方云集，并是受法者。若去，则与偕行。”","trans":"玄策说：“我人微言轻，不足以为你印证。曹溪山有六祖惠能大师，四面八方的人都云集在他那里，并且都是受得正法的。你如果想去，我就和你同行。”","origSents":["策云：“我言轻，曹溪有六祖大师，四方云集，并是受法者。","若去，则与偕行。","”"]},{"orig":"觉遂同策来参。绕师三匝，振锡而立。","trans":"永嘉玄觉便随同玄策来参礼六祖惠能大师。玄觉绕着惠能走了三圈，举着锡杖一振，站在那里不动。","origSents":["觉遂同策来参。","绕师三匝，振锡而立。"]},{"orig":"师曰：“夫沙门者，具三千威仪，八万细行。大德自何方而来，生大我慢？”","trans":"惠能大师说：“出家人，应该具有三千威仪、八万细行等种种戒律仪轨。大德你是从哪里来，对我生起如此大的傲慢和不敬？”","origSents":["师曰：“夫沙门者，具三千威仪，八万细行。","大德自何方而来，生大我慢？","”"]},{"orig":"觉曰：“生死事大，无常迅速。”","trans":"玄觉说：“人的生死才是大事，且无常交替迅速，变化很快。”","origSents":["觉曰：“生死事大，无常迅速。","”"]},{"orig":"师曰：“何不体取无生，了无速乎？”","trans":"惠能大师说：“为什么不体悟领受无生无死，明了这无常迅速的道理呢？”","origSents":["师曰：“何不体取无生，了无速乎？","”"]},{"orig":"曰：“体即无生，了本无速。”","trans":"玄觉说：“体悟的就是无生无死，明了的就是无常迅速。”","origSents":["曰：“体即无生，了本无速。","”"]},{"orig":"师曰：“如是！如是！”","trans":"惠能说：“是这样!是这样!”","origSents":["师曰：“如是！","如是！","”"]},{"orig":"玄觉方具威仪礼拜，须臾告辞。","trans":"玄觉这才整肃仪容向惠能大师礼敬参拜，一会儿便向大师告辞欲走。","origSents":["玄觉方具威仪礼拜，须臾告辞。"]},{"orig":"师曰：“返太速乎？”","trans":"惠能大师说：“你这就返回，太快了吧？”","origSents":["师曰：“返太速乎？","”"]},{"orig":"曰：“本自非动，岂有速耶？”","trans":"玄觉说：“本来就没有动与不动，哪里有快和不快？”","origSents":["曰：“本自非动，岂有速耶？","”"]},{"orig":"师曰：“谁知非动？”","trans":"惠能大师说：“谁能知道不是动呢？”","origSents":["师曰：“谁知非动？","”"]},{"orig":"曰：“仁者自生分别。”","trans":"玄觉说：“这是您自己生起了分别之心。”","origSents":["曰：“仁者自生分别。","”"]},{"orig":"师曰：“汝甚得无生之意。”","trans":"惠能大师说：“你已经十分了解无生无死的道理了。”","origSents":["师曰：“汝甚得无生之意。","”"]},{"orig":"曰：“无生岂有意耶？”","trans":"玄觉说：“无生无死难道还有意义吗？”","origSents":["曰：“无生岂有意耶？","”"]},{"orig":"师曰：“无意谁当分别？”","trans":"惠能大师说：“没有意义谁能分别它呢？”","origSents":["师曰：“无意谁当分别？","”"]},{"orig":"曰：“分别亦非意。”","trans":"玄觉说：“分别本身也没有意义。”","origSents":["曰：“分别亦非意。","”"]},{"orig":"师曰：“善哉！少留一宿。”","trans":"惠能大师说：“好啊！小住一晚吧。”","origSents":["师曰：“善哉！","少留一宿。","”"]},{"orig":"时谓“一宿觉”。后著《证道歌》，盛行于世。","trans":"当时称之为“一宿觉”。后来永嘉玄觉作了《证道歌》，流传盛行于世间。","origSents":["时谓“一宿觉”。","后著《证道歌》，盛行于世。"]},{"orig":"禅者智隍，初参五祖，自谓已得正受。庵居长坐，积二十年。师弟子玄策，游方至河朔，闻隍之名，造庵问云：“汝在此作什么？”","trans":"智隍禅师，最初参拜五祖弘忍，自己宣称已经得到了正宗传授。智隍居住在庵室里长期打坐，累计二十年了。惠能大师的弟子玄策，游历到河北一带，听说了智隍的名声，便造访智隍的庵室，问：“你在这里干什么？”","origSents":["禅者智隍，初参五祖，自谓已得正受。","庵居长坐，积二十年。","师弟子玄策，游方至河朔，闻隍之名，造庵问云：“汝在此作什么？","”"]},{"orig":"隍曰：“入定。”","trans":"智隍回答说：“入定。”","origSents":["隍曰：“入定。","”"]},{"orig":"策云：“汝云入定，为有心入耶，无心入耶？若无心入者，一切无情草木瓦石，应合得定；若有心入者，一切有情含识之流，亦应得定。”","trans":"玄策问：“你说入定，是有心念入定呢，还是无心念入定呢？如果是无心念入定的，一切的草木瓦石无情众生，应该都能达到入定；如果是有心念入定的，一切含有意识的有情众生之类，也应该能达到入定。”","origSents":["策云：“汝云入定，为有心入耶，无心入耶？","若无心入者，一切无情草木瓦石，应合得定；","若有心入者，一切有情含识之流，亦应得定。","”"]},{"orig":"隍曰：“我正入定时，不见有有无之心。”","trans":"智隍说：“当我真正入定时，看不到我有‘有无’的心念。”","origSents":["隍曰：“我正入定时，不见有有无之心。","”"]},{"orig":"策云：“不见有有无之心，即是常定，何有出入？若有出入，即非大定！”","trans":"玄策说：“看不到‘有无’的心念，就是常定，怎么又有出入之分呢？如果有出有入，那就不是真正的定了！”","origSents":["策云：“不见有有无之心，即是常定，何有出入？","若有出入，即非大定！","”"]},{"orig":"隍无对。良久，问曰：“师嗣谁耶？”","trans":"智隍无言以对。过了很久，问玄策：“你师承的是谁啊？”","origSents":["隍无对。","良久，问曰：“师嗣谁耶？","”"]},{"orig":"策云：“我师曹溪六祖。”","trans":"玄策说：“我的师父是曹溪山六祖惠能大师。”","origSents":["策云：“我师曹溪六祖。","”"]},{"orig":"隍云：“六祖以何为禅定？”","trans":"智隍问：“六祖惠能大师认为什么是禅定？”","origSents":["隍云：“六祖以何为禅定？","”"]},{"orig":"策云：“我师所说，妙湛圆寂，体用如如，五阴本空，六尘非有。不出不入，不定不乱。禅性无住，离住禅寂。禅性无生，离生禅想。心如虚空，亦无虚空之量。”","trans":"玄策说：“我师父说，法身圆融玄妙湛然常寂，性相体用一如，五蕴和合，本来是空，六尘也不是真实存在。既不出，也不入，不执于定，不生散乱心。禅的本性是不执无滞的，要住禅寂。禅性无生，要超离执着禅的念想。心如同虚空一样，不存在对虚空的度量。”","origSents":["策云：“我师所说，妙湛圆寂，体用如如，五阴本空，六尘非有。","不出不入，不定不乱。","禅性无住，离住禅寂。","禅性无生，离生禅想。","心如虚空，亦无虚空之量。","”"]},{"orig":"隍闻是说，径来谒师。","trans":"智隍听到这样说法，直接来拜谒六祖惠能大师。","origSents":["隍闻是说，径来谒师。"]},{"orig":"师问云：“仁者何来？”","trans":"惠能大师问：“你从哪里来？”","origSents":["师问云：“仁者何来？","”"]},{"orig":"隍具述前缘。","trans":"智隍把遇到玄策的因缘全部描述了一遍。","origSents":["隍具述前缘。"]},{"orig":"师云：“诚如所言，汝但心如虚空，不著空见，应用无碍，动静无心，凡圣情忘，能所俱泯，性相如如，无不定时也。”","trans":"惠能大师说：“正像玄策说的那样，你只要心如虚空一般，又不执着于对空的妄见，自如应用，没有滞碍，对于动静，不生其心，世俗和圣境全部两忘，主观和客观对象能够一齐泯绝，性相如一，就无时无刻不在禅定之中，没有不禅定的时刻了。”","origSents":["师云：“诚如所言，汝但心如虚空，不著空见，应用无碍，动静无心，凡圣情忘，能所俱泯，性相如如，无不定时也。","”"]},{"orig":"隍于是大悟，二十年所得心，都无影响。其夜河北士庶闻空中有声云：“隍禅师今日得道！”隍后礼辞，复归河北，开化四众。","trans":"智隍于是大彻大悟，二十年修行所得的执着之心，刹那间都没有留下影响。那天夜里黄河以北的官吏和百姓都听到空中有声音说：“智隍禅师今天得成佛道了！”智隍后来礼敬告辞，又回到了黄河以北，开示教化大众。","origSents":["隍于是大悟，二十年所得心，都无影响。","其夜河北士庶闻空中有声云：“隍禅师今日得道！","”隍后礼辞，复归河北，开化四众。"]},{"orig":"一僧问师云：“黄梅意旨，甚么人得？”","trans":"有一个僧人问惠能大师：“黄梅五祖弘忍大师的衣钵，什么人得到了？”","origSents":["一僧问师云：“黄梅意旨，甚么人得？","”"]},{"orig":"师云：“会佛法人得。”","trans":"惠能大师说：“领会佛法的人得到了。”","origSents":["师云：“会佛法人得。","”"]},{"orig":"僧云：“和尚还得否？”","trans":"僧人问：“大师您得到了吗？”","origSents":["僧云：“和尚还得否？","”"]},{"orig":"师云：“我不会佛法。”","trans":"惠能大师说：“我不明白佛法。”","origSents":["师云：“我不会佛法。","”"]},{"orig":"师一日欲濯所授之衣，而无美泉。因至寺后五里许，见山林郁茂，瑞气盘旋，师振锡卓地，泉应手而出。积以为池，乃跪膝浣衣石上。忽有一僧来礼拜，云：“方辩是西蜀人。昨于南天竺国，见达摩大师，嘱方辩速往唐土：吾传大迦叶正法眼藏，及僧伽梨，见传六代，于韶州曹溪，汝去瞻礼。方辩远来，愿见我师传来衣钵。”","trans":"有一天，惠能大师想洗涤一下五祖弘忍大师所传的袈裟，可是周围没有上好的清泉。因此大师来到寺庙后面五里远的地方，看到这里山林葱郁茂密，有祥瑞之气笼罩盘旋，惠能大师举起锡杖在地上一戳。泉水立刻涌了出来。积成了一个水池，惠能大师便跪在石头上洗着袈裟。忽然有一个僧人来礼敬参拜，说：“我方辩是西蜀人。昨天在南天竺国，见到达摩大师，他嘱咐我赶快到唐国来，达摩大师说他所传大迦叶的真正教法及法衣，现在传到第六代祖，目前在韶州曹溪山，你去瞻仰礼拜他。方辩我远道而来，希望能得见达摩祖师所传之袈裟。”","origSents":["师一日欲濯所授之衣，而无美泉。","因至寺后五里许，见山林郁茂，瑞气盘旋，师振锡卓地，泉应手而出。","积以为池，乃跪膝浣衣石上。","忽有一僧来礼拜，云：“方辩是西蜀人。","昨于南天竺国，见达摩大师，嘱方辩速往唐土：吾传大迦叶正法眼藏，及僧伽梨，见传六代，于韶州曹溪，汝去瞻礼。","方辩远来，愿见我师传来衣钵。","”"]},{"orig":"师乃出示。次问：“上人攻何事业？”","trans":"惠能大师取出袈裟展示给他看。随后问：“你擅长什么事呢？”","origSents":["师乃出示。","次问：“上人攻何事业？","”"]},{"orig":"曰：“善塑。”","trans":"方辩说：“擅长雕塑。”","origSents":["曰：“善塑。","”"]},{"orig":"师正色曰：“汝试塑看。”","trans":"惠能严肃地说：“你试着雕给我看看。”","origSents":["师正色曰：“汝试塑看。","”"]},{"orig":"辩罔措。过数日，塑就真相，可高七寸，曲尽其妙。","trans":"方辩一时迷惘无措。过了几天，雕好了一尊佛像，高七寸，曲尽其妙，十分逼真。","origSents":["辩罔措。","过数日，塑就真相，可高七寸，曲尽其妙。"]},{"orig":"师笑曰：“汝只解塑性，不解佛性。”","trans":"惠能大师笑着说：“你只理解了雕塑之特性，不理解佛性。”","origSents":["师笑曰：“汝只解塑性，不解佛性。","”"]},{"orig":"师舒手摩方辩顶。曰：“永为人天福田。”","trans":"惠能大师用手抚摩方辩的头顶说：“希望你生生世世都成为人天种福之田。”","origSents":["师舒手摩方辩顶。","曰：“永为人天福田。","”"]},{"orig":"有僧举卧轮禅师偈曰：","trans":"有一个僧人展示了卧轮禅师的一首偈：","origSents":["有僧举卧轮禅师偈曰："]},{"orig":"卧轮有伎俩，能断百思想。","trans":"卧轮有伎俩，能断百思想。","origSents":["卧轮有伎俩，能断百思想。"]},{"orig":"对境心不起，菩提日日长。","trans":"对境心不起，菩提日日长。","origSents":["对境心不起，菩提日日长。"]},{"orig":"师闻之，曰：“此偈未明心地。若依而行之，是加系缚。”","trans":"惠能大师听了说：“这个偈还没有明见自性。如果按照这个偈来修行，是更增加了束缚。”","origSents":["师闻之，曰：“此偈未明心地。","若依而行之，是加系缚。","”"]},{"orig":"因示一偈曰：","trans":"因此开示了一个偈，说：","origSents":["因示一偈曰："]},{"orig":"惠能没伎俩，不断百思想；","trans":"惠能没伎俩，不断百思想；","origSents":["惠能没伎俩，不断百思想；"]},{"orig":"对境心数起，菩提作么长？","trans":"对境心数起，菩提作么长？","origSents":["对境心数起，菩提作么长？"]}]},{"title":"顿渐品第八","pairedParas":[{"orig":"时，祖师居曹溪宝林，神秀大师在荆南玉泉寺。于时两宗盛化，人皆称南能北秀，故有南北二宗顿渐之分。而学者莫知宗趣。师谓众曰：“法本一宗，人有南北；法即一种，见有迟疾。何名顿渐？法无顿渐，人有利钝，故名顿渐。”","trans":"那时，惠能大师在曹溪山宝林寺，神秀大师在荆南玉泉寺。故而当时两大宗派兴盛教化，被人们称为“南能北秀”，有南宗北宗、顿教渐教的分别。然而学道修禅的人们并不知道他们的宗义和旨趣。惠能大师对众人说：“佛法本是一种宗义，因为传法之人有南北，才有了南宗北宗的区分；佛法就是一种，只是识见悟性有快有慢，才有了顿悟渐悟的区分。什么叫顿悟渐悟？佛法本身没有顿悟渐悟之分，人的根器有敏锐和愚钝才有顿悟渐悟之分，所以称之为顿渐。”","origSents":["时，祖师居曹溪宝林，神秀大师在荆南玉泉寺。","于时两宗盛化，人皆称南能北秀，故有南北二宗顿渐之分。","而学者莫知宗趣。","师谓众曰：“法本一宗，人有南北；","法即一种，见有迟疾。","何名顿渐？","法无顿渐，人有利钝，故名顿渐。","”"]},{"orig":"然秀之徒众，往往讥南宗祖师：“不识一字，有何所长？”","trans":"然而神秀大师的弟子门人，往往讥讽南宗六祖惠能大师：“不识一个字，能有什么过人之处呢？”","origSents":["然秀之徒众，往往讥南宗祖师：“不识一字，有何所长？","”"]},{"orig":"秀曰：“他得无师之智，深悟上乘，吾不如也。且吾师五祖，亲传衣法，岂徒然哉？吾恨不能远去亲近，虚受国恩。汝等诸人毋滞于此，可往曹溪参决。”一日，命门人志诚曰：“汝聪明多智，可为吾到曹溪听法。若有所闻，尽心记取，还为吾说。”","trans":"神秀大师说：“惠能得到了不需要师父传授而自悟自通的智慧，深入见悟最上乘智慧，我比不上他。并且我师父五祖弘忍大师亲自传授衣钵和教法给他，难道是白费气力的吗？我只恨不能远道去与他多交流，在这里白白地受领国家对我的恩宠。你们不要总是滞留在我的身边，可以前往曹溪山参访学习。”神秀大师这天对弟子志诚说：“你聪明而且智慧多多，可以为我去曹溪山听惠能大师的教法。如果听到什么，尽力地记住，回来再告诉我。”","origSents":["秀曰：“他得无师之智，深悟上乘，吾不如也。","且吾师五祖，亲传衣法，岂徒然哉？","吾恨不能远去亲近，虚受国恩。","汝等诸人毋滞于此，可往曹溪参决。","”一日，命门人志诚曰：“汝聪明多智，可为吾到曹溪听法。","若有所闻，尽心记取，还为吾说。","”"]},{"orig":"志诚禀命至曹溪，随众参请，不言来处。时祖师告众曰：“今有盗法之人，潜在此会。”志诚即出礼拜，具陈其事。师曰：“汝从玉泉来，应是细作。”","trans":"志诚奉命来到曹溪山，跟随着大众向惠能大师参学请益，没有说明自己是从哪里来的。当时，惠能大师向大众宣告说：“今天有偷听教法的人，潜藏在这里。”志诚立刻出来礼敬参拜，全部陈述了来这里的因由。惠能大师说：“你从玉泉寺来，那就是奸细了。”","origSents":["志诚禀命至曹溪，随众参请，不言来处。","时祖师告众曰：“今有盗法之人，潜在此会。","”志诚即出礼拜，具陈其事。","师曰：“汝从玉泉来，应是细作。","”"]},{"orig":"对曰：“不是。”","trans":"志诚说：“我不是。”","origSents":["对曰：“不是。","”"]},{"orig":"师曰：“何得不是？”","trans":"惠能大师说：“何以见得你不是？”","origSents":["师曰：“何得不是？","”"]},{"orig":"对曰：“未说即是，说了不是。”","trans":"志诚说：“我没有说明来意可以说是奸细，表明来意就不能算是了。”","origSents":["对曰：“未说即是，说了不是。","”"]},{"orig":"师曰：“汝师若为示众？”","trans":"惠能大师说：“你师父神秀大师是如何开示大众的？”","origSents":["师曰：“汝师若为示众？","”"]},{"orig":"对曰：“常指诲大众，住心观静，长坐不卧。”","trans":"志诚说：“师父常常指授教诲大众守住本心，观想清净，长期静坐，不要睡觉。”","origSents":["对曰：“常指诲大众，住心观静，长坐不卧。","”"]},{"orig":"师曰：“住心观静，是病非禅。长坐拘身，于理何益？听吾偈。”曰：","trans":"惠能大师说：“住心观静，这是错误的，这不是修禅。常期静坐，拘束身体，对参悟佛法真意并没有什么帮助。听我的偈吧。”偈说：","origSents":["师曰：“住心观静，是病非禅。","长坐拘身，于理何益？","听吾偈。","”曰："]},{"orig":"生来坐不卧，死去卧不坐；","trans":"生来坐不卧，死去卧不坐；","origSents":["生来坐不卧，死去卧不坐；"]},{"orig":"一具臭骨头，何为立功课？","trans":"一具臭骨头，何为立功课？","origSents":["一具臭骨头，何为立功课？"]},{"orig":"志诚再拜曰：“弟子在秀大师处，学道九年，不得契悟。今闻和尚一说，便契本心。弟子生死事大，和尚大慈，更为教示。”","trans":"志诚两次礼拜惠能大师说：“弟子我在神秀大师那里，参学已有九年，没有得到契证开悟。今天听大师您这么一说，就契合了本心。弟子认为解脱生死是件大事，希望大师慈悲为怀，再给我一些教化开示。”","origSents":["志诚再拜曰：“弟子在秀大师处，学道九年，不得契悟。","今闻和尚一说，便契本心。","弟子生死事大，和尚大慈，更为教示。","”"]},{"orig":"师云：“吾闻汝师教示学人戒定慧法，未审汝师说戒定慧行相如何？与吾说看。”","trans":"惠能大师说：“我听说你师父教授开示弟子戒定慧法，不清楚你师父是如何说戒定慧的相状的？你给我说说看。”","origSents":["师云：“吾闻汝师教示学人戒定慧法，未审汝师说戒定慧行相如何？","与吾说看。","”"]},{"orig":"诚曰：“秀大师说：诸恶莫作名为戒，诸善奉行名为慧，自净其意名为定。彼说如此，未审和尚以何法诲人？”","trans":"志诚说：“神秀大师说，一切恶行不要造作叫做戒，一切善念全都奉行叫做慧，自己清净意念叫做定。神秀大师是那样说的，不清楚大师您用什么教法教诲大众？”","origSents":["诚曰：“秀大师说：诸恶莫作名为戒，诸善奉行名为慧，自净其意名为定。","彼说如此，未审和尚以何法诲人？","”"]},{"orig":"师曰：“吾若言有法与人，即为诳汝。但且随方解缚，假名三昧。如汝师所说戒定慧，实不可思议；吾所见戒定慧又别。”","trans":"惠能大师说：“我如果说有教法给你，那就是骗你。只是根据不同情况，方便说法，解除束缚，借用修行三昧的假名。像你师父说的戒定慧，实在是不可思议；我所认识的戒定慧和他不同。”","origSents":["师曰：“吾若言有法与人，即为诳汝。","但且随方解缚，假名三昧。","如汝师所说戒定慧，实不可思议；","吾所见戒定慧又别。","”"]},{"orig":"志诚曰：“戒定慧只合一种，如何更别？”","trans":"志诚说：“戒定慧只应该有一种，怎么还有分别？”","origSents":["志诚曰：“戒定慧只合一种，如何更别？","”"]},{"orig":"师曰：“汝师戒定慧接大乘人，吾戒定慧接最上乘人，悟解不同，见有迟疾。汝听吾说，与彼同否？吾所说法，不离自性。离体说法，名为相说，自性常迷。须知一切万法，皆从自性起用，是真戒定慧法。听吾偈。”曰：","trans":"惠能大师说：“你师父的戒定慧接引大乘根器的人，我的戒定慧接引上乘根器的人，领悟理解不尽相同，识见自我心性有快有慢。你听我说的和他说的相同吗？我所说的教法，不离开自我本性。离开自性本体说法，叫做执着相状上说法，自己的心念常常愚迷。要知道一切事物和现象，都从自性中生起运用，这是真正的戒定慧法。听我的偈吧。”偈所说：","origSents":["师曰：“汝师戒定慧接大乘人，吾戒定慧接最上乘人，悟解不同，见有迟疾。","汝听吾说，与彼同否？","吾所说法，不离自性。","离体说法，名为相说，自性常迷。","须知一切万法，皆从自性起用，是真戒定慧法。","听吾偈。","”曰："]},{"orig":"心地无非自性戒，","trans":"心地无非自性戒，","origSents":["心地无非自性戒，"]},{"orig":"心地无痴自性慧，","trans":"心地无痴自性慧，","origSents":["心地无痴自性慧，"]},{"orig":"心地无乱自性定，","trans":"心地无乱自性定，","origSents":["心地无乱自性定，"]},{"orig":"不增不减自金刚，","trans":"不增不减自金刚，","origSents":["不增不减自金刚，"]},{"orig":"身去身来本三昧。","trans":"身去身来本三昧。","origSents":["身去身来本三昧。"]},{"orig":"诚闻偈，悔谢，乃呈一偈曰：","trans":"志诚听了偈以后悔悟拜谢，便呈上一个偈说道：","origSents":["诚闻偈，悔谢，乃呈一偈曰："]},{"orig":"五蕴幻身，幻何究竟？","trans":"五蕴幻身，幻何究竟？","origSents":["五蕴幻身，幻何究竟？"]},{"orig":"回趣真如，法还不净。","trans":"回趣真如，法还不净。","origSents":["回趣真如，法还不净。"]},{"orig":"师然之。复语诚曰：“汝师戒定慧，劝小根智人；吾戒定慧，劝大根智人。若悟自性，亦不立菩提涅槃，亦不立解脱知见；无一法可得，方能建立万法。若解此意，亦名佛身，亦名菩提涅槃，亦名解脱知见。见性之人，立亦得，不立亦得。去来自由，无滞无碍。应用随作，应语随答，普见化身，不离自性，即得自在神通，游戏三昧，是名见性。”","trans":"惠能大师称许肯定。又告诉志诚说：“你师父所说的戒定慧，是劝诫小根器的人；我所说的戒定慧，是劝诫大根器的人。如果开悟了自我本性，也就不用再立菩提涅槃，也不用立对解脱的认识和见解；没有一个法可以得，才能建立一切法。如果理解了这个本意，就叫做佛，也叫做菩提涅槃，也叫做解脱知见。识见本性的人，立这些名也能得法，不立这些名也能得法。去来自由，没有滞留、没有妨碍。应用自如，随缘运作，根据语言随机答对，全部识见一切化身而又不离自我本性，这就得到随缘变化、自在无碍的神通，到达了游戏三昧的境界，叫做识见本性。”","origSents":["师然之。","复语诚曰：“汝师戒定慧，劝小根智人；","吾戒定慧，劝大根智人。","若悟自性，亦不立菩提涅槃，亦不立解脱知见；","无一法可得，方能建立万法。","若解此意，亦名佛身，亦名菩提涅槃，亦名解脱知见。","见性之人，立亦得，不立亦得。","去来自由，无滞无碍。","应用随作，应语随答，普见化身，不离自性，即得自在神通，游戏三昧，是名见性。","”"]},{"orig":"志诚再启师曰：“如何是不立义？”","trans":"志诚再次拜谢大师并禀告说：“什么是不立之义？”","origSents":["志诚再启师曰：“如何是不立义？","”"]},{"orig":"师曰：“自性无非、无痴、无乱，念念般若观照，常离法相，自由自在，纵横尽得，有何可立？自性自悟，顿悟顿修，亦无渐次，所以不立一切法。诸法寂灭，有何次第？”","trans":"大师说：“自我本性没有是非、没有愚痴、没有散乱，时时运用智慧观照，常常超离法相，自由自在，或纵或横全部都有所得，有什么佛法可以立呢？自己开悟自我本性，顿悟顿修，也没有渐次顺序，所以不需要立任何佛法。一切法都寂灭了，还有什么次第顺序呢？”","origSents":["师曰：“自性无非、无痴、无乱，念念般若观照，常离法相，自由自在，纵横尽得，有何可立？","自性自悟，顿悟顿修，亦无渐次，所以不立一切法。","诸法寂灭，有何次第？","”"]},{"orig":"志诚礼拜，愿为执侍，朝夕不懈。","trans":"志诚礼拜惠能大师，愿意侍奉大师，早晚不停歇。","origSents":["志诚礼拜，愿为执侍，朝夕不懈。"]},{"orig":"僧志彻，江西人，本姓张，名行昌，少任侠。自南北分化，二宗主虽亡彼我，而徒侣竞起爱憎。时北宗门人，自立秀师为第六祖，而忌祖师传衣为天下闻，乃嘱行昌来刺师。","trans":"僧人志彻，江西人，原来姓张，名字叫行昌，少年时候喜好行侠仗义。自从南宗北宗产生分化之后，两派宗主神秀大师和惠能大师虽然不分彼此、没有争胜，然而他们的弟子徒众却竞相生起爱憎之心。当时，北宗弟子们，自封神秀大师为禅宗第六代祖师，又忌讳天下人都知道的惠能大师得传衣钵之事，便嘱咐行昌来行刺惠能大师。","origSents":["僧志彻，江西人，本姓张，名行昌，少任侠。","自南北分化，二宗主虽亡彼我，而徒侣竞起爱憎。","时北宗门人，自立秀师为第六祖，而忌祖师传衣为天下闻，乃嘱行昌来刺师。"]},{"orig":"师心通，预知其事，即置金十两于座间。时夜暮，行昌入祖室，将欲加害。师舒颈就之，行昌挥刃者三，悉无所损。","trans":"惠能大师事先预测到了这件事，便放了十两黄金在座位上。那天天黑了，行昌潜入惠能大师的房间，准备加害大师。大师伸出脖子给他砍，行昌砍了三刀，都一点没有损伤到惠能大师。","origSents":["师心通，预知其事，即置金十两于座间。","时夜暮，行昌入祖室，将欲加害。","师舒颈就之，行昌挥刃者三，悉无所损。"]},{"orig":"师曰：“正剑不邪，邪剑不正，只负汝金，不负汝命。”","trans":"大师说：“正义之剑不会邪恶，邪恶之剑不能正义，我只该给你金钱，不欠你性命。”","origSents":["师曰：“正剑不邪，邪剑不正，只负汝金，不负汝命。","”"]},{"orig":"行昌惊仆，久而方苏，求哀悔过，即愿出家。师遂与金，言：“汝且去，恐徒众翻害于汝。汝可他日易形而来，吾当摄受。”行昌禀旨宵遁，后投僧出家，具戒精进。","trans":"行昌惊恐万状，扑倒在地，很久才苏醒过来，哀求能够悔过自新，当即愿意出家为僧。大师便给了他金钱，说：“你暂时先去，我担心我的弟子们反过来要加害你。你可以在其他时间乔装打扮再来，我自当接受你为徒。”行昌领受大师旨意连夜离开。后来投奔僧人剃度出家，接受戒规，精进修行。","origSents":["行昌惊仆，久而方苏，求哀悔过，即愿出家。","师遂与金，言：“汝且去，恐徒众翻害于汝。","汝可他日易形而来，吾当摄受。","”行昌禀旨宵遁，后投僧出家，具戒精进。"]},{"orig":"一日，忆师之言，远来礼觐。师曰：“吾久念汝，汝来何晚？”","trans":"有一天，想起了惠能大师的话，远道而来拜见大师。大师说：“我念叨你很久了，你为什么这么晚才来？”","origSents":["一日，忆师之言，远来礼觐。","师曰：“吾久念汝，汝来何晚？","”"]},{"orig":"曰：“昨蒙和尚舍罪，今虽出家苦行，终难报德，其惟传法度生乎！弟子常览《涅槃经》，未晓常无常义，乞和尚慈悲，略为解说。”","trans":"行昌说：“上次承蒙大师饶恕我的罪过。现在我虽然出家苦苦修行，终究难以报答大恩大德，唯有随您传法度众生。弟子我常常阅览《涅槃经》，不明白常、无常的教义。恳请大师慈悲，简单为我解说。”","origSents":["曰：“昨蒙和尚舍罪，今虽出家苦行，终难报德，其惟传法度生乎！","弟子常览《涅槃经》，未晓常无常义，乞和尚慈悲，略为解说。","”"]},{"orig":"师曰：“无常者，即佛性也；有常者，即一切善恶诸法分别心也。”","trans":"大师说：“无常，就是佛性；常，就是对一切善恶法的分别心。”","origSents":["师曰：“无常者，即佛性也；","有常者，即一切善恶诸法分别心也。","”"]},{"orig":"曰：“和尚所说，大违经文。”","trans":"行昌说：“大师，你说的与经文大相径庭。”","origSents":["曰：“和尚所说，大违经文。","”"]},{"orig":"师曰：“吾传佛心印，安敢违于佛经？”","trans":"惠能大师说：“我传授佛法心印，怎么敢违背佛经呢？”","origSents":["师曰：“吾传佛心印，安敢违于佛经？","”"]},{"orig":"曰：“经说佛性是常，和尚却言无常；善恶之法乃至菩提心，皆是无常，和尚却言是常，此即相违，令学人转加疑惑。”","trans":"行昌说：“经文上说佛性是常，大师您却说佛性是无常；一切善恶事物，甚至无上觉悟，都是无常，大师您却说是常，这不是与经文相背吗？这使得我更加增添了疑惑。”","origSents":["曰：“经说佛性是常，和尚却言无常；","善恶之法乃至菩提心，皆是无常，和尚却言是常，此即相违，令学人转加疑惑。","”"]},{"orig":"师曰：“《涅槃经》，吾昔听尼无尽藏读诵一遍，便为讲说，无一字一义不合经文。乃至为汝，终无二说。”","trans":"大师说：“《涅槃经》，我曾经听尼姑无尽藏比丘尼念诵过，我给她讲说经文大义，没有一点不符合佛经的。刚才给你讲的，也是同样的道理，不会有别的说法。”","origSents":["师曰：“《涅槃经》，吾昔听尼无尽藏读诵一遍，便为讲说，无一字一义不合经文。","乃至为汝，终无二说。","”"]},{"orig":"曰：“学人识量浅昧，愿和尚委曲开示。”","trans":"行昌说：“我见识浅薄，希望师父开示。”","origSents":["曰：“学人识量浅昧，愿和尚委曲开示。","”"]},{"orig":"师曰：“汝知否？佛性若常，更说什么善恶诸法、乃至穷劫无有一人发菩提心者？故吾说无常，正是佛说真常之道也。又，一切诸法若无常者，即物物皆有自性，容受生死，而真常性有不遍之处。故吾说常者，正是佛说真无常义。佛比为凡夫外道执于邪常，诸二乘人于常计无常，共成八倒。故于涅槃了义教中，破彼偏见，而显说真常真乐真我真净。汝今依言背义，以断灭无常，及确定死常，而错解佛之圆妙最后微言，纵览千遍，有何所益？”","trans":"惠能大师说：“你知道吗？如果佛性是常，为什么还要说善恶诸法，以至于还说从来没有人发菩提觉悟之心？所以我说佛性无常，是说佛性真实常在。还有，如果说一切事物无常，是说万事万物都有自己的体性，用以承受生死，而真实存在的佛性也有不能遍及的地方。所以我说的常，正是佛说的无常。佛知道世俗人和外道将无常看作真实存在，而声闻和缘觉二乘人，把佛性看作无常。所以出现了常、乐、我、净、非常、非乐、非我、非净八种颠倒妄想见。《涅槃经》的教义是破斥这些断见，指出什么是真常、真乐、真我、真净四德。你依据经文文字却违背经文经义，以有断灭的现象为无常，而以确定僵死为常，错误地理解佛陀最后开示的妙谛。这样纵使念经千遍，又有何用？”","origSents":["师曰：“汝知否？","佛性若常，更说什么善恶诸法、乃至穷劫无有一人发菩提心者？","故吾说无常，正是佛说真常之道也。","又，一切诸法若无常者，即物物皆有自性，容受生死，而真常性有不遍之处。","故吾说常者，正是佛说真无常义。","佛比为凡夫外道执于邪常，诸二乘人于常计无常，共成八倒。","故于涅槃了义教中，破彼偏见，而显说真常真乐真我真净。","汝今依言背义，以断灭无常，及确定死常，而错解佛之圆妙最后微言，纵览千遍，有何所益？","”"]},{"orig":"行昌忽然大悟，说偈曰：","trans":"行昌豁然开悟，说了偈子：","origSents":["行昌忽然大悟，说偈曰："]},{"orig":"因守无常心，佛说有常性；","trans":"因守无常心，佛说有常性；","origSents":["因守无常心，佛说有常性；"]},{"orig":"不知方便者，犹春池拾砾。","trans":"不知方便者，犹春池拾砾。","origSents":["不知方便者，犹春池拾砾。"]},{"orig":"我今不施功，佛性而现前；","trans":"我今不施功，佛性而现前；","origSents":["我今不施功，佛性而现前；"]},{"orig":"非师相授与，我亦无所得。","trans":"非师相授与，我亦无所得。","origSents":["非师相授与，我亦无所得。"]},{"orig":"师曰：“汝今彻也，宜名志彻。”","trans":"惠能大师说：“你现在彻底开悟了，你就改名叫志彻吧。”","origSents":["师曰：“汝今彻也，宜名志彻。","”"]},{"orig":"彻礼谢而退。","trans":"志彻行礼致谢后便退下。","origSents":["彻礼谢而退。"]},{"orig":"有一童子，名神会，襄阳高氏子。年十三，自玉泉来参礼。","trans":"有一个童子，名叫神会，襄阳高家的子弟。十三岁时，从神秀主持的玉泉寺来到曹溪山向惠能大师致礼。","origSents":["有一童子，名神会，襄阳高氏子。","年十三，自玉泉来参礼。"]},{"orig":"师曰：“知识远来艰辛，还将得本来否？若有本则合识主，试说看！”","trans":"惠能大师说：“善知识远道而来，辛苦非常，还能识见事物的本来面目吗？如果认识事物的本来面目，就应该识见本体，你先说说看。”","origSents":["师曰：“知识远来艰辛，还将得本来否？","若有本则合识主，试说看！","”"]},{"orig":"会曰：“以无住为本，见即是主。”","trans":"神会说：“事物的本来面目无所住，永远不会静止，认识本身就是主体。”","origSents":["会曰：“以无住为本，见即是主。","”"]},{"orig":"师曰：“这沙弥争合取次语！”","trans":"惠能大师说：“这个小师父怎么说话如此轻率！”","origSents":["师曰：“这沙弥争合取次语！","”"]},{"orig":"会乃问曰：“和尚坐禅，还见不见？”","trans":"神会说：“大师你坐禅，识见佛性了吗？”","origSents":["会乃问曰：“和尚坐禅，还见不见？","”"]},{"orig":"师以柱杖打三下，云：“吾打汝痛不痛？”","trans":"惠能大师用禅杖打了神会三下子，问：“我打你，痛还是不痛？”","origSents":["师以柱杖打三下，云：“吾打汝痛不痛？","”"]},{"orig":"对曰：“亦痛亦不痛。”","trans":"神会说：“也痛也不痛。”","origSents":["对曰：“亦痛亦不痛。","”"]},{"orig":"师曰：“吾亦见亦不见。”","trans":"惠能大师说：“那我见了，也没有见。”","origSents":["师曰：“吾亦见亦不见。","”"]},{"orig":"神会问：“如何是亦见亦不见？”","trans":"神会问：“什么叫做也见了，也没见？”","origSents":["神会问：“如何是亦见亦不见？","”"]},{"orig":"师云：“吾之所见，常见自心过愆，不见他人是非好恶，是以亦见亦不见。汝言亦痛亦不痛如何？汝若不痛，同其木石；若痛，则同凡夫，即起恚恨。汝向前见不见是二边，痛不痛是生灭。汝自性且不见，敢尔弄人？”","trans":"惠能大师说：“我说见是说常见自己的过错，不见他人的是非好恶，这是说见到了，也没见到。那你说也痛也不痛是什么意思？你如果不痛，你就是和草木瓦石一样没有知觉；你如果说痛，那你就和凡夫俗子一样，会生起怨恨之心。见与不见是两种偏见，痛和不痛是可以生灭的有为法。你还没识见本心，怎敢捉弄他人？”","origSents":["师云：“吾之所见，常见自心过愆，不见他人是非好恶，是以亦见亦不见。","汝言亦痛亦不痛如何？","汝若不痛，同其木石；","若痛，则同凡夫，即起恚恨。","汝向前见不见是二边，痛不痛是生灭。","汝自性且不见，敢尔弄人？","”"]},{"orig":"神会礼拜悔谢。","trans":"神会礼拜表示悔过。","origSents":["神会礼拜悔谢。"]},{"orig":"师又曰：“汝若心迷不见，问善知识觅路。汝若心悟，即自见性，依法修行。汝自迷不见自心，却来问吾见与不见。吾见自知，岂代汝迷？汝若自见，亦不代吾迷。何不自知自见，乃问吾见与不见？”","trans":"惠能大师又说：“如果心念愚迷，不能识见本性，就必须找善知识教示。如果心念开悟，识见自性，就依此修行。现在你自己迷误，不能认识真心，反来问我是否识见佛性。我是否识见佛心，我自己心知肚明，难道这能代替你不迷误？反之亦然，你如果能够识见自性也代替不了我的迷误。为何不去自我识见、自我认识，却在这里问我有没有识见佛性？”","origSents":["师又曰：“汝若心迷不见，问善知识觅路。","汝若心悟，即自见性，依法修行。","汝自迷不见自心，却来问吾见与不见。","吾见自知，岂代汝迷？","汝若自见，亦不代吾迷。","何不自知自见，乃问吾见与不见？","”"]},{"orig":"神会再礼百余拜，求谢过愆，服勤给侍，不离左右。","trans":"神会再次向惠能大师致礼多达一百多次，请求饶恕，并勤勉地做杂务和服侍大师，不离大师身边。","origSents":["神会再礼百余拜，求谢过愆，服勤给侍，不离左右。"]},{"orig":"一日，师告众曰：“吾有一物，无头无尾，无名无字，无背无面，诸人还识否？”","trans":"有一天，惠能大师告诉大家：“我有一样东西，没头没尾，没名没字，没背面，没正面，大家知道是什么吗？”","origSents":["一日，师告众曰：“吾有一物，无头无尾，无名无字，无背无面，诸人还识否？","”"]},{"orig":"神会出曰：“是诸佛之本源，神会之佛性。”","trans":"神会起立说道：“是一切佛的本源，是神会的佛性。”","origSents":["神会出曰：“是诸佛之本源，神会之佛性。","”"]},{"orig":"师曰：“向汝道无名无字，汝便唤作本源佛性。汝向去有把芔盖头，也只成个知解宗徒。”","trans":"大师说：“对你说了没名没字，你却还要把他叫做本源佛性。你以后即便当了住持，也只能成为一个知解宗徒。”","origSents":["师曰：“向汝道无名无字，汝便唤作本源佛性。","汝向去有把芔盖头，也只成个知解宗徒。","”"]},{"orig":"祖师灭后，会入京洛，大弘曹溪顿教，著《显宗记》，盛行于世，是为荷泽禅师。","trans":"惠能大师圆寂后，神会到了京师长安与洛阳，大力弘扬惠能大师的顿教法门，著有《显宗记》，盛行于世，这就是著名的荷泽禅师。","origSents":["祖师灭后，会入京洛，大弘曹溪顿教，著《显宗记》，盛行于世，是为荷泽禅师。"]},{"orig":"师见诸宗难问，咸起恶心，多集座下，愍而谓曰：“学道之人，一切善念恶念，应当尽除。无名可名，名于自性；无二之性，是名实性。于实性上建立一切教门，言下便须自见。”诸人闻说，总皆作礼，请事为师。","trans":"惠能大师看到各宗派之间互相为难指责，弟子们都生起邪恶之心，所以经常召集门人弟子，宽厚怜悯地对大家说：“修行佛道的人，一切善念、恶念，都应该全部除掉。没有什么名相可以指称自我本性；独具无二、没有分别的自性叫做实性。在实性的基础上建立一切教派法门，都必须立刻就能自我识见。”所有人听了，全都行礼，请求惠能大师教化指授他们。","origSents":["师见诸宗难问，咸起恶心，多集座下，愍而谓曰：“学道之人，一切善念恶念，应当尽除。","无名可名，名于自性；","无二之性，是名实性。","于实性上建立一切教门，言下便须自见。","”诸人闻说，总皆作礼，请事为师。"]}]},{"title":"护法品第九","pairedParas":[{"orig":"神龙元年上元日，则天、中宗诏云：“朕请安秀二师，宫中供养。万机之暇，每究一乘。二师推让云：‘南方有能禅师，密授忍大师衣法，传佛心印，可请彼问。’今遣内侍薛简，驰诏迎请，愿师慈念，速赴上京。”","trans":"唐中宗神龙元年正月十五日，太后武则天和唐中宗下诏说：“我迎请嵩山慧安和荆南玉泉寺的神秀两位大师到宫里来，诚心供养。于日理万机之中，每有空暇，就向两位大师请教，研究佛法。两位大师十分谦让，都推举惠能大师。说：‘南方有位惠能大师从五祖弘忍大师那里秘密得受了衣钵和教法，得传了佛法的心印，可以迎请他来宫中向他请教。’现在我派遣内侍薛简传达诏书来迎请大师，望大师慈悲为怀，立即赶赴京城。”","origSents":["神龙元年上元日，则天、中宗诏云：“朕请安秀二师，宫中供养。","万机之暇，每究一乘。","二师推让云：‘南方有能禅师，密授忍大师衣法，传佛心印，可请彼问。","’今遣内侍薛简，驰诏迎请，愿师慈念，速赴上京。","”"]},{"orig":"师上表辞疾，愿终林麓。","trans":"惠能大师上呈了表章，以身体有疾病为理由推辞了延请，并表示自己愿意永远生活于山林之中，直到终老。","origSents":["师上表辞疾，愿终林麓。"]},{"orig":"薛简曰：“京城禅德皆云：‘欲得会道，必须坐禅习定；若不因禅定而得解脱者，未之有也。’未审师所说法如何？”","trans":"薛简说：“京城里的禅师大德都说：‘想要领会佛道，必须要坐禅习定；如果不凭藉修禅习定而能够得到解脱，这样的人还没出现过。’不知道大师您所讲说的教法是什么样子的？”","origSents":["薛简曰：“京城禅德皆云：‘欲得会道，必须坐禅习定；","若不因禅定而得解脱者，未之有也。","’未审师所说法如何？","”"]},{"orig":"师曰：“道由心悟，岂在坐也？经云：‘若言如来若坐若卧，是行邪道。’何故？无所从来，亦无所去，无生无灭，是如来清净禅；诸法空寂，是如来清净坐。究竟无证，岂况坐耶？”","trans":"惠能大师说：“得成佛道要靠自心开悟，怎么会是在于长期打坐呢？佛经上说：‘如果说佛似乎在坐或似乎在卧，那么就是在修行邪道。’这是什么原因呢？既没有所来之处，也没要去的地方，没有生成也没有毁灭，这是佛的清净禅；一切事物现象虚幻空寂，这是佛的清净坐。最终的究竟解脱是没有办法印证的，更何况长期打坐。”","origSents":["师曰：“道由心悟，岂在坐也？","经云：‘若言如来若坐若卧，是行邪道。","’何故？","无所从来，亦无所去，无生无灭，是如来清净禅；","诸法空寂，是如来清净坐。","究竟无证，岂况坐耶？","”"]},{"orig":"简曰：“弟子回京，主上必问。愿师慈悲，指示心要，传奏两宫，及京城学道者。譬如一灯，然百千灯，冥者皆明，明明无尽。”","trans":"薛简说：“弟子我回到京城，太后皇上必然问起大师的教法心要，希望大师慈悲为怀，给我指点开示要旨心得，我好表奏太后皇上两宫，以及京城参学佛道的人士。这好比一盏灯点燃千百万盏灯，晦暗都得到光明。灯灯光明没有穷尽。”","origSents":["简曰：“弟子回京，主上必问。","愿师慈悲，指示心要，传奏两宫，及京城学道者。","譬如一灯，然百千灯，冥者皆明，明明无尽。","”"]},{"orig":"师云：“道无明暗，明暗是代谢之义。明明无尽，亦是有尽，相待立名。故《净名经》云：‘法无有比，无相待故。’”","trans":"惠能大师说：“佛道没有光明黑暗的区分，光明和黑暗的意义是相互代谢，互为依存。说光明处处没有尽头，其实也终究是有尽头的。光明和黑暗二者是互为对立、互为条件一对概念范畴。所以《净名经》说：‘佛法没有事物可与比拟，没有事物可以与之相对应的。’说的就是这个道理。”","origSents":["师云：“道无明暗，明暗是代谢之义。","明明无尽，亦是有尽，相待立名。","故《净名经》云：‘法无有比，无相待故。","’”"]},{"orig":"简曰：“明喻智慧，暗喻烦恼。修道之人，倘不以智慧照破烦恼，无始生死，凭何出离？”","trans":"薛简说：“光明比喻智慧，黑暗比喻烦恼。修行佛道的人如果不用智慧观照破斥烦恼，无始以来的生死靠什么来超离呢？”","origSents":["简曰：“明喻智慧，暗喻烦恼。","修道之人，倘不以智慧照破烦恼，无始生死，凭何出离？","”"]},{"orig":"师曰：“烦恼即是菩提，无二无别。若以智慧照破烦恼者，此是二乘见解，羊鹿等机；上智大根，悉不如是。”","trans":"惠能大师说：“烦恼就是菩提，不是两种东西，它们本质相同，没有分别。如果要用智慧观照破斥烦恼，那这就是声闻和缘觉二乘的见解，是《法华经》上说的乘坐羊车和鹿车的人的见解；有上智和大根器的人，都不是这样理解的。”","origSents":["师曰：“烦恼即是菩提，无二无别。","若以智慧照破烦恼者，此是二乘见解，羊鹿等机；","上智大根，悉不如是。","”"]},{"orig":"简曰：“如何是大乘见解？”","trans":"薛简说：“什么是大乘的见解呢？”","origSents":["简曰：“如何是大乘见解？","”"]},{"orig":"师曰：“明与无明，凡夫见二；智者了达，其性无二。无二之性，即是实性。实性者，处凡愚而不减，在贤圣而不增；住烦恼而不乱，居禅定而不寂。不断不常，不来不去，不在中间，及其内外。不生不灭，性相如如，常住不迁，名之曰道。”","trans":"惠能大师说：“光明智慧和愚迷黑暗，凡夫俗子看到的是两种东西的不同性质；智慧了达的人则明白他们在本质上是没有区别的。这种没有区别、平等一致的本性就是真实佛性。真实佛性，处于凡俗愚迷境地时不会减少，处于贤明圣达的境地时不会增加；处于烦恼中而不散乱，处于禅定中而不寂灭。没有断绝没有永恒，没有来处没有去处，也不停留在中间状态，也不存在于内部和外部。没有生成和毁灭，本性和相状真实如一，永恒存在没有变化，叫做佛道。”","origSents":["师曰：“明与无明，凡夫见二；","智者了达，其性无二。","无二之性，即是实性。","实性者，处凡愚而不减，在贤圣而不增；","住烦恼而不乱，居禅定而不寂。","不断不常，不来不去，不在中间，及其内外。","不生不灭，性相如如，常住不迁，名之曰道。","”"]},{"orig":"简曰：“师说不生不灭，何异外道？”","trans":"薛简说：“大师所说的没有生成和毁灭，与外道有什么不同之处？”","origSents":["简曰：“师说不生不灭，何异外道？","”"]},{"orig":"师曰：“外道所说不生不灭者，将灭止生，以生显灭，灭犹不灭，生说不生。我说不生不灭者，本自无生，今亦不灭，所以不同外道。汝若欲知心要，但一切善恶，都莫思量，自然得入清净心体，湛然常寂，妙用恒沙。”","trans":"惠能大师说：“外道所讲的没有生成毁灭，是用毁灭来止断生成，用生成来显示毁灭，这种毁灭等于没有毁灭，生成也可以说没有生成。我说的没有生成没有毁灭，是本来就没有生成，现在也不存在毁灭，所以是与外道不同的。你如果想要知道心得要旨，只要一切善和恶都不去思维度量它，自然而然悟入清净本心，湛然明净，永恒静寂，其妙用之多，犹如恒河之沙。”","origSents":["师曰：“外道所说不生不灭者，将灭止生，以生显灭，灭犹不灭，生说不生。","我说不生不灭者，本自无生，今亦不灭，所以不同外道。","汝若欲知心要，但一切善恶，都莫思量，自然得入清净心体，湛然常寂，妙用恒沙。","”"]},{"orig":"简蒙指教，豁然大悟。礼辞归阙，表奏师语。","trans":"薛简受到了指点教化，豁然开悟。礼敬辞别惠能大师而回归宫中，上表报奏了惠能大师的教说。","origSents":["简蒙指教，豁然大悟。","礼辞归阙，表奏师语。"]},{"orig":"其年九月三日，有诏奖谕师曰：“师辞老疾，为朕修道，国之福田。师若净名，托疾毗耶，阐扬大乘，传诸佛心，谈不二法。薛简传师指授如来知见，朕积善余庆，宿种善根，值师出世，顿悟上乘，感荷师恩，顶戴无已。并奉磨衲袈裟，及水晶钵，敕韶州刺史修饰寺宇，赐师旧居为国恩寺。”","trans":"这一年的九月三日，朝廷下诏褒奖赞誉惠能大师，说：“大师以年老多病辞去召请，一心修行佛道，这是国家的福报啊。大师就如同维摩诘居士一样，推脱有病而居住于毗耶离城中，从而大力弘扬大乘佛法，传授一切佛的心印，宣讲佛性平等无二的教法。薛简已经上表奏明了大师所传授的佛智见解，往昔积累的善行使我有了今天的福报，是前世种下的善根，正逢大师出世行化，令我立刻顿悟佛法上乘。承受大师的恩泽，十分感激，致礼不已。同时奉送磨衲袈裟和水晶钵，命令韶州刺史维修整饰寺庙殿宇，赐名大师的旧居为国恩寺。”","origSents":["其年九月三日，有诏奖谕师曰：“师辞老疾，为朕修道，国之福田。","师若净名，托疾毗耶，阐扬大乘，传诸佛心，谈不二法。","薛简传师指授如来知见，朕积善余庆，宿种善根，值师出世，顿悟上乘，感荷师恩，顶戴无已。","并奉磨衲袈裟，及水晶钵，敕韶州刺史修饰寺宇，赐师旧居为国恩寺。","”"]}]},{"title":"付嘱品第十","pairedParas":[{"orig":"师一日唤门人法海、志诚、法达、神会、智常、智通、志彻、志道、法珍、法如等，曰：“汝等不同余人，吾灭度后，各为一方师。吾今教汝说法，不失本宗。","trans":"一天，惠能大师叫来了弟子法海、志诚、法达、神会、智常、智通、志彻、志道、法珍、法如等，对他们说：“你们几个和其他人不一样，等我去世以后，你们各自要作教化一方的宗师。我现在教你们应当如何说法，才不会失去本宗宗旨。“说法时首先必须列举出三科法门，使用三十六对相对法，言语一经说出口就要脱离两端，不落实处。讲说一切法的时候均不能离开自性。若突然有人问你佛法，说出来的话语要全部是对应成双的，全部要取相对的方法，言语来去要前后相应、互为因果。最后把生灭、有无二法全部扫除干净，再没有什么可以落执的处所。","origSents":["师一日唤门人法海、志诚、法达、神会、智常、智通、志彻、志道、法珍、法如等，曰：“汝等不同余人，吾灭度后，各为一方师。","吾今教汝说法，不失本宗。"]},{"orig":"“先须举三科法门，动用三十六对，出没即离两边。说一切法，莫离自性。忽有人问汝法，出语尽双，皆取对法，来去相因。究竟二法尽除，更无去处。","trans":"“说法时首先必须列举出三科法门，使用三十六对相对法，言语一经说出口就要脱离两端，不落实处。讲说一切法的时候均不能离开自性。若突然有人问你佛法，说出来的话语要全部是对应成双的，全部要取相对的方法，言语来去要前后相应、互为因果。最后把生灭、有无二法全部扫除干净，再没有什么可以落执的处所。“三科法门，就是阴、界、入。阴是五阴，即色、受、想、行、识。入就是十二入，就是身外六尘：色、声、香、味、触、法，身内六门：眼、耳、鼻、舌、身、意。界是十八界，就是六尘、六门和六识。自我本性能够含藏一切事物和现象，这叫做含藏识。如果生起分别思量，就是转识。生起眼识、耳识、鼻识、舌识、身识、意识这六识，六识通过眼、耳、鼻、舌、身、意六门认识了色、声、香、味、触、法六尘，这样就是十八界，全部是从自性中生起和产生作用的。“自性若邪，起十八邪；自性若正，起十八正。若恶用即众生用，善用即佛用；用由何等，由自性有。","origSents":["“先须举三科法门，动用三十六对，出没即离两边。","说一切法，莫离自性。","忽有人问汝法，出语尽双，皆取对法，来去相因。","究竟二法尽除，更无去处。"]},{"orig":"“三科法门者，阴界入也。阴是五阴，色、受、想、行、识是也。入是十二入，外六尘，色、声、香、味、触、法，内六门，眼、耳、鼻、舌、身、意是也。界是十八界，六尘、六门、六识是也。自性能含万法，名含藏识。若起思量，即是转识。生六识，出六门，见六尘，如是一十八界，皆从自性起用。","trans":"“自性若邪，起十八邪；自性若正，起十八正。若恶用即众生用，善用即佛用；用由何等，由自性有。“对法外境，无情五对：天与地对，日与月对，明与暗对，阴与阳对，水与火对，此是五对也。","origSents":["“三科法门者，阴界入也。","阴是五阴，色、受、想、行、识是也。","入是十二入，外六尘，色、声、香、味、触、法，内六门，眼、耳、鼻、舌、身、意是也。","界是十八界，六尘、六门、六识是也。","自性能含万法，名含藏识。","若起思量，即是转识。","生六识，出六门，见六尘，如是一十八界，皆从自性起用。"]},{"orig":"“法相语言十二对：语与法对，有与无对，有色与无色对，有相与无相对，有漏与无漏对，色与空对，动与静对，清与浊对，凡与圣对，僧与俗对，老与少对，大与小对，此是十二对也。","trans":"“自性如果邪恶执迷，就会生起十八种邪念；自性如果端正，就会生起十八种正念。恶念起用就是众生之用，善念起用就是佛之用；被恶念所用还是被善念所用，这由什么来决定，都是由自性决定其所用。“所谓三十六对法，外界无情的事物有五对：天与地相对，太阳和月亮相对，光明与黑暗相对，阴和阳相对，水和火相对，这是无情的五对。“事物的本性、相状和语言方面有十二对：语言与佛法相对、有与无相对、有色与无色相对、有相与无相相对、有漏与无漏相对、色与空相对、动与静相对、清澈与浑浊相对、凡人与圣人相对、僧人与俗人相对、老与少相对、大与小相对，这是法相语言的十二对。","origSents":["“法相语言十二对：语与法对，有与无对，有色与无色对，有相与无相对，有漏与无漏对，色与空对，动与静对，清与浊对，凡与圣对，僧与俗对，老与少对，大与小对，此是十二对也。"]},{"orig":"“自性起用十九对：长与短对，邪与正对，痴与慧对，愚与智对，乱与定对，慈与毒对，戒与非对，直与曲对，实与虚对，险与平对，烦恼与菩提对，常与无常对，悲与害对，喜与嗔对，舍与悭对，进与退对，生与灭对，法身与色身对，化身与报身对，此是十九对也。”","trans":"“事物的本性、相状和语言方面有十二对：语言与佛法相对、有与无相对、有色与无色相对、有相与无相相对、有漏与无漏相对、色与空相对、动与静相对、清澈与浑浊相对、凡人与圣人相对、僧人与俗人相对、老与少相对、大与小相对，这是法相语言的十二对。“自性中生起的作用有十九对：长与短相对、邪见与正见相对、愚痴与聪慧相对、愚笨与智慧相对、乱与定相对、慈悲与毒害相对、戒与非相对、直与曲相对、真实与虚妄相对、险与平相对、烦恼与菩提相对、常与无常相对、悲与害相对、欢喜与嗔怒相对、施舍与吝啬相对、前进与后退相对、生起与寂灭相对、法身与色身相对、化身与报身相对，这是自性起用的十九对。”惠能大师说：“这三十六对相对法的教法，如果能够理解运用，就能贯通一切佛法与经典，与人交谈时，进退都能不执两边、脱离两个极端。”","origSents":["“自性起用十九对：长与短对，邪与正对，痴与慧对，愚与智对，乱与定对，慈与毒对，戒与非对，直与曲对，实与虚对，险与平对，烦恼与菩提对，常与无常对，悲与害对，喜与嗔对，舍与悭对，进与退对，生与灭对，法身与色身对，化身与报身对，此是十九对也。","”"]},{"orig":"师言：“此三十六对法，若解用，即道贯一切经法，出入即离两边。”","trans":"惠能大师说：“这三十六对相对法的教法，如果能够理解运用，就能贯通一切佛法与经典，与人交谈时，进退都能不执两边、脱离两个极端。”“自性动用，共人言语，外于相离相，内于空离空。若全著相，即长邪见。若全执空，即长无明。执空之人有谤经，直言不用文字。既云不用文字，人亦不合语言；只此语言，便是文字之相。又云，直道不立文字，即此不立两字，亦是文字。见人所说，便即谤他言著文字，汝等须知自迷犹可，又谤佛经；不要谤经，罪障无数。“若著相于外，而作法求真；或广立道场，说有无之过患，如是之人，累劫不得见性。但听依法修行，又莫百物不思，而于道性窒碍。若听说不修，令人反生邪念。但依法修行无住相法施。汝等若悟，依此说，依此用，依此行，依此作，即不失本宗。","origSents":["师言：“此三十六对法，若解用，即道贯一切经法，出入即离两边。","”"]},{"orig":"“若有人问汝义，问有将无对，问无将有对；问凡以圣对，问圣以凡对。二道相因，生中道义。","trans":"“自性启动并生发作用的时候，和别人一起言论，对外在事物不执着它的相状，对内在心念不执着于空无。如果全部执着于外在的相状，就增长邪见。如果执着于空无，就增长无明愚痴。执着虚妄空无的人常常会诽谤佛教经典，说不需要文字。既然说不需要文字，那么就不该有语言文字；只是这样的语言，就是落入文字之相。又说直行佛道要不立文字，就是‘不立’这两个字，本身就是文字。看到别人所说的，就立刻诽谤别人的言语是执着于文字，你们知道自己愚迷也就罢了，还来诽谤佛经；千万不要诽谤佛经，那样的话，罪过障碍会多得无法计数。“如果执着于外在境相，便会造作种种方法去求取佛道；或者广泛地建立道场，宣讲有无的得失，像这样的人，永远不能识见自己的本性。像这样的人要听从正法依止修行，还有不要什么都不想，而障碍佛道本性使之窒断。如果只是听说而不去修行，反而会使人生起邪念。所以必须依照佛法修行，不执着于相，并以此讲说佛法。你们如果能够开悟，依照这个讲说，依照这个运用，依照这个修行，依照这个作为，就不会迷失本门宗旨。“如果有人问你佛法的意义，问有就用无来对，问无就用有来对；问凡人就用圣人来对，问圣人就用凡人来对。在对立二相的因缘转化中，持中道的本义。","origSents":["“若有人问汝义，问有将无对，问无将有对；","问凡以圣对，问圣以凡对。","二道相因，生中道义。"]},{"orig":"“如一问一对，余问一依此作，即不失理也。设有人问：何名为暗？答云：明是因，暗是缘，明没即暗。以明显暗，以暗显明，来去相因，成中道义。余问悉皆如此。汝等于后传法，依此转相教授，勿失宗旨。”","trans":"“如果有人问你佛法的意义，问有就用无来对，问无就用有来对；问凡人就用圣人来对，问圣人就用凡人来对。在对立二相的因缘转化中，持中道的本义。“像这样一问一答，其余的问题也全部按照这样来作答，就不会失去中道教义。假设有人问什么是暗？回答：光明是本源，黑暗是条件，光明消失则黑暗顿生。以光明来凸显黑暗，以黑暗来凸显光明，来去互为因果，成就中道意义。其余的提问全部都是这样解答。你们在以后的传法过程中，依据这个相互转告，相互教化指授，不要失去本门宗旨。”","origSents":["“如一问一对，余问一依此作，即不失理也。","设有人问：何名为暗？","答云：明是因，暗是缘，明没即暗。","以明显暗，以暗显明，来去相因，成中道义。","余问悉皆如此。","汝等于后传法，依此转相教授，勿失宗旨。","”"]},{"orig":"师于太极元年壬子，延和七月，命门人往新州国恩寺建塔，仍令促工。次年夏末落成。七月一日，集徒众曰：“吾至八月，欲离世间。汝等有疑，早须相问，为汝破疑，令汝迷尽。吾若去后，无人教汝。”","trans":"惠能大师在唐睿宗太极元年，即壬子年，也就是延和元年的七月，命令弟子前往新州国恩寺建塔，还命令人去催促施工。第二年夏天快结束的时候，塔建成竣工了。七月一日，惠能大师召集弟子门人，对他们说：“我到八月，将要离开人世。你们有什么疑问，要早点来问，我为你们破除疑惑，让你们愚迷尽除。我如果去世以后，就没有人再指导你们了。”法海等弟子听说以后，全部都痛哭流涕；只有神会，神色表情丝毫没有变动，也没有哭泣流泪。","origSents":["师于太极元年壬子，延和七月，命门人往新州国恩寺建塔，仍令促工。","次年夏末落成。","七月一日，集徒众曰：“吾至八月，欲离世间。","汝等有疑，早须相问，为汝破疑，令汝迷尽。","吾若去后，无人教汝。","”"]},{"orig":"法海等闻，悉皆涕泣；惟有神会，神情不动，亦无涕泣。","trans":"法海等弟子听说以后，全部都痛哭流涕；只有神会，神色表情丝毫没有变动，也没有哭泣流泪。惠能大师说：“神会虽是个小禅师，却能得悟善与不善平等无差，不被诋毁称誉所动摇，不生起哀伤和喜乐。其他人都没能做到，十几年在山中修行，究竟修了什么道？你们现在悲伤哭泣，是为了谁忧伤？如果是伤心我不知往哪里去，其实我自己知道我的去处，我如果不知道去处，是不会向你们事先通报的。你们悲伤哭泣，都是因为不知道我的去处。如果知道我的去处，就不该悲伤。佛法本性本来没有生灭来去，你们都全部坐下，我给你们说一个偈，名称为《真假动静偈》。你们念诵听取这个偈，就能和我的心意相同；依照这个偈修行，就不会迷失宗门旨趣。”","origSents":["法海等闻，悉皆涕泣；","惟有神会，神情不动，亦无涕泣。"]},{"orig":"师云：“神会小师，却得善不善等，毁誉不动，哀乐不生。余者不得，数年山中，竟修何道？汝今悲泣，为忧阿谁？若忧吾不知去处，吾自知去处，吾若不知去处，终不预报于汝。汝等悲泣，盖为不知吾去处。若知吾去处，即不合悲泣。法性本无生灭去来，汝等尽坐，吾与汝说一偈，名曰《真假动静偈》。汝等诵取此偈，与吾意同；依此修行，不失宗旨。”","trans":"惠能大师说：“神会虽是个小禅师，却能得悟善与不善平等无差，不被诋毁称誉所动摇，不生起哀伤和喜乐。其他人都没能做到，十几年在山中修行，究竟修了什么道？你们现在悲伤哭泣，是为了谁忧伤？如果是伤心我不知往哪里去，其实我自己知道我的去处，我如果不知道去处，是不会向你们事先通报的。你们悲伤哭泣，都是因为不知道我的去处。如果知道我的去处，就不该悲伤。佛法本性本来没有生灭来去，你们都全部坐下，我给你们说一个偈，名称为《真假动静偈》。你们念诵听取这个偈，就能和我的心意相同；依照这个偈修行，就不会迷失宗门旨趣。”所有僧人都行礼，请惠能大师作偈。偈子说：","origSents":["师云：“神会小师，却得善不善等，毁誉不动，哀乐不生。","余者不得，数年山中，竟修何道？","汝今悲泣，为忧阿谁？","若忧吾不知去处，吾自知去处，吾若不知去处，终不预报于汝。","汝等悲泣，盖为不知吾去处。","若知吾去处，即不合悲泣。","法性本无生灭去来，汝等尽坐，吾与汝说一偈，名曰《真假动静偈》。","汝等诵取此偈，与吾意同；","依此修行，不失宗旨。","”"]},{"orig":"众僧作礼，请师说偈。偈曰：","trans":"所有僧人都行礼，请惠能大师作偈。偈子说：一切无有真，不以见于真；","origSents":["众僧作礼，请师说偈。","偈曰："]},{"orig":"一切无有真，不以见于真；","trans":"一切无有真，不以见于真；若见于真者，是见尽非真。","origSents":["一切无有真，不以见于真；"]},{"orig":"若见于真者，是见尽非真。","trans":"若见于真者，是见尽非真。若能自有真，离假即心真；","origSents":["若见于真者，是见尽非真。"]},{"orig":"若能自有真，离假即心真；","trans":"若能自有真，离假即心真；自心不离假，无真何处真？","origSents":["若能自有真，离假即心真；"]},{"orig":"自心不离假，无真何处真？","trans":"自心不离假，无真何处真？有情即解动，无情即不动；","origSents":["自心不离假，无真何处真？"]},{"orig":"有情即解动，无情即不动；","trans":"有情即解动，无情即不动；若修不动行，同无情不动。","origSents":["有情即解动，无情即不动；"]},{"orig":"若修不动行，同无情不动。","trans":"若修不动行，同无情不动。若觅真不动，动上有不动；不动是不动，无情无佛种。","origSents":["若修不动行，同无情不动。"]},{"orig":"若觅真不动，动上有不动；","trans":"不动是不动，无情无佛种。能善分别相，第一义不动；","origSents":["若觅真不动，动上有不动；"]},{"orig":"不动是不动，无情无佛种。","trans":"能善分别相，第一义不动；但作如此见，即是真如用。","origSents":["不动是不动，无情无佛种。"]},{"orig":"能善分别相，第一义不动；","trans":"但作如此见，即是真如用。报诸学道人，努力须用意；","origSents":["能善分别相，第一义不动；"]},{"orig":"但作如此见，即是真如用。","trans":"报诸学道人，努力须用意；莫于大乘门，却执生死智。","origSents":["但作如此见，即是真如用。"]},{"orig":"报诸学道人，努力须用意；","trans":"莫于大乘门，却执生死智。若言下相应，即共论佛义；","origSents":["报诸学道人，努力须用意；"]},{"orig":"莫于大乘门，却执生死智。","trans":"若言下相应，即共论佛义；若实不相应，合掌令欢喜。","origSents":["莫于大乘门，却执生死智。"]},{"orig":"若言下相应，即共论佛义；","trans":"若实不相应，合掌令欢喜。此宗本无诤，诤即失道意；","origSents":["若言下相应，即共论佛义；"]},{"orig":"若实不相应，合掌令欢喜。","trans":"此宗本无诤，诤即失道意；执逆诤法门，自性入生死。","origSents":["若实不相应，合掌令欢喜。"]},{"orig":"此宗本无诤，诤即失道意；","trans":"执逆诤法门，自性入生死。时，徒众闻说偈已，普皆作礼。并体师意，各各摄心，依法修行，更不敢诤。乃知大师不久住世，法海上座，再拜问曰：“和尚入灭之后，衣法当付何人？”","origSents":["此宗本无诤，诤即失道意；"]},{"orig":"执逆诤法门，自性入生死。","trans":"时，徒众闻说偈已，普皆作礼。并体师意，各各摄心，依法修行，更不敢诤。乃知大师不久住世，法海上座，再拜问曰：“和尚入灭之后，衣法当付何人？”师曰：“吾于大梵寺说法，以至于今，抄录流行，目曰《法宝坛经》。汝等守护，递相传授，度诸群生。但依此说，是名正法。今为汝等说法，不付其衣。盖为汝等信根淳熟，决定无疑，堪任大事。然据先祖达摩大师，付授偈意，衣不合传。”偈曰：","origSents":["执逆诤法门，自性入生死。"]},{"orig":"吾本来兹土，传法救迷情；","trans":"当时，弟子门人们听完了偈，全都行礼。并且各自体会惠能大师的意思，收拾本心，依照这个法门修行，不再相互争辩了。由于知道了惠能大师停驻人世的时间不多了，法海上座在此礼拜惠能大师，问道：“大师入灭之后，衣钵和教法应该传给谁？”惠能大师说：“我在大梵寺说法，直到现在，所演说的内容已经被抄录下来并广为流布风行，其名目叫作《法宝坛经》。你们好好守护，次第相互流传指授，去度化人群众生。依照这个说法的就是真正的佛法。我现在为你们说法，不再付嘱袈裟，就是因为你们都已经信根淳熟，正定而没有疑惑，可以堪当弘法的大任了。而且根据祖师达摩大师付嘱所传授的偈子的含义，衣钵袈裟是不应该传下去的。”偈子说：吾本来兹土，传法救迷情；","origSents":["吾本来兹土，传法救迷情；"]},{"orig":"一华开五叶，结果自然成。","trans":"吾本来兹土，传法救迷情；一华开五叶，结果自然成。","origSents":["一华开五叶，结果自然成。"]},{"orig":"师复曰：“诸善知识！汝等各各净心，听吾说法。若欲成就种智，须达一相三昧，一行三昧。若于一切处而不住相，于彼相中不生憎爱，亦无取舍，不念利益成坏等事，安闲恬静，虚融澹泊，此名一相三昧。若于一切处，行住坐卧，纯一直心，不动道场，真成净土，此名一行三昧。若人具二三昧，如地有种，含藏长养，成熟其实，一相一行，亦复如是。","trans":"惠能大师又说：“各位善知识！你们各自清净心念，听我讲说佛法。如果要成就佛的智慧，必须达到一相三昧和一行三昧。如果在一切境相之中而能不执着于一切境相，对于那些相状不生起憎恶爱欲，也没有取得和舍弃，不考虑利益关系、成功失败等事情，安闲恬静，虚融淡泊，这叫做一相三昧。如果在一切处所，行住坐卧，直了心性，不需要借助外在道场，当下成就真实净土，这叫做一行三昧。如果人具有这两个三昧，就如同大地中含有种子，经过孕含、蓄藏、生长和培养，果实得以成熟。一相三昧和一行三昧，也是这样。“我现在说法，好像及时雨，普遍润泽大地。你们的佛性，好像一粒粒的种子，遇到时雨滋润都能发芽生长。继承我的宗旨的人，肯定能证获菩提智慧；依照我的教法修行的人，肯定能证悟佛道妙果。听我的偈吧。”偈说：","origSents":["师复曰：“诸善知识！","汝等各各净心，听吾说法。","若欲成就种智，须达一相三昧，一行三昧。","若于一切处而不住相，于彼相中不生憎爱，亦无取舍，不念利益成坏等事，安闲恬静，虚融澹泊，此名一相三昧。","若于一切处，行住坐卧，纯一直心，不动道场，真成净土，此名一行三昧。","若人具二三昧，如地有种，含藏长养，成熟其实，一相一行，亦复如是。"]},{"orig":"“我今说法，犹如时雨，普润大地。汝等佛性，譬诸种子，遇兹沾洽，悉得发生。承吾旨者，决获菩提；依吾行者，定证妙果。听吾偈。”曰：","trans":"“我现在说法，好像及时雨，普遍润泽大地。你们的佛性，好像一粒粒的种子，遇到时雨滋润都能发芽生长。继承我的宗旨的人，肯定能证获菩提智慧；依照我的教法修行的人，肯定能证悟佛道妙果。听我的偈吧。”偈说：心地含诸种，普雨悉皆萌。顿悟华情已，菩提果自成。","origSents":["“我今说法，犹如时雨，普润大地。","汝等佛性，譬诸种子，遇兹沾洽，悉得发生。","承吾旨者，决获菩提；","依吾行者，定证妙果。","听吾偈。","”曰："]},{"orig":"心地含诸种，普雨悉皆萌，","trans":"顿悟华情已，菩提果自成。惠能大师说完偈，说：“佛法不是二法，本心也是如此。佛道本是清净的，没有一切相状。你们千万要慎重，不要执着观静和空寂其心。本心原是本来清净的，没有取舍的，各自回去努力，随顺因缘好好去吧。”当时弟子门人行礼后都退下了。","origSents":["心地含诸种，普雨悉皆萌，"]},{"orig":"顿悟华情已，菩提果自成。","trans":"当时弟子门人行礼后都退下了。大师七月八日，忽谓门人曰：“吾欲归新州，汝等速理舟楫。”","origSents":["顿悟华情已，菩提果自成。"]},{"orig":"师说偈已，曰：“其法无二，其心亦然。其道清净，亦无诸相。汝等慎勿观静，及空其心。此心本净，无可取舍，各自努力，随缘好去。”","trans":"大师七月八日，忽谓门人曰：“吾欲归新州，汝等速理舟楫。”大众哀留甚坚。师曰：“诸佛出现，犹示涅槃，有来必去，理亦常然。吾此形骸，归必有所。”","origSents":["师说偈已，曰：“其法无二，其心亦然。","其道清净，亦无诸相。","汝等慎勿观静，及空其心。","此心本净，无可取舍，各自努力，随缘好去。","”"]},{"orig":"尔时徒众作礼而退。","trans":"师曰：“诸佛出现，犹示涅槃，有来必去，理亦常然。吾此形骸，归必有所。”众曰：“师从此去，早晚可回？”","origSents":["尔时徒众作礼而退。"]},{"orig":"师曰：“叶落归根，来时无口。”","trans":"七月八日，惠能大师忽然与弟子说：“我要回新州，你们赶快准备船只。”弟子门人苦苦哀求，坚决挽留。","origSents":["师曰：“叶落归根，来时无口。","”"]},{"orig":"又问曰：“正法眼藏，传付何人？”","trans":"弟子门人苦苦哀求，坚决挽留。惠能大师说：“一切佛出现，都会指示涅槃，有来就会有去，道理本应就是这样。我这具躯体形骸，也该回去了。”弟子们说：“大师从今天走了以后，早晚还会回来吗？”","origSents":["又问曰：“正法眼藏，传付何人？","”"]},{"orig":"师曰：“有道者得，无心者通。”","trans":"弟子们说：“大师从今天走了以后，早晚还会回来吗？”惠能大师说：“落叶归根，我一生没有讲什么话。”","origSents":["师曰：“有道者得，无心者通。","”"]},{"orig":"又问：“后莫有难否？”","trans":"惠能大师说：“落叶归根，我一生没有讲什么话。”弟子又问：“佛教正法，大师将传授交付给哪一个？”惠能大师说：“证悟了佛道的人会得到，无执着心的人会通达领会。”","origSents":["又问：“后莫有难否？","”"]},{"orig":"师曰：“吾灭后五六年，当有一人来取吾首。听吾记曰：头上养亲，口里须餐；遇满之难，杨柳为官。”","trans":"惠能大师说：“证悟了佛道的人会得到，无执着心的人会通达领会。”弟子又问：“以后是不是会有劫难啊？”","origSents":["师曰：“吾灭后五六年，当有一人来取吾首。","听吾记曰：头上养亲，口里须餐；","遇满之难，杨柳为官。","”"]},{"orig":"又云：“吾去七十年，有二菩萨，从东方来，一出家，一在家，同时兴化，建立吾宗；缔缉伽蓝，昌隆法嗣。”","trans":"弟子又问：“以后是不是会有劫难啊？”惠能大师说：“我去世后五六年，应该会有一个人前来取我的首级。听我的偈记：头上养亲，口里需餐。遇满之难，杨柳为官。”惠能大师又说：“我去世后七十年，有两位菩萨，从东方来，一位是出家僧人，一位是在家居士，他们同时大兴教化，建立宗派；修建寺庙，昌盛兴隆佛法宗门。”","origSents":["又云：“吾去七十年，有二菩萨，从东方来，一出家，一在家，同时兴化，建立吾宗；","缔缉伽蓝，昌隆法嗣。","”"]},{"orig":"问曰：“未知从上佛祖应现已来，传授几代？愿垂开示。”","trans":"惠能大师又说：“我去世后七十年，有两位菩萨，从东方来，一位是出家僧人，一位是在家居士，他们同时大兴教化，建立宗派；修建寺庙，昌盛兴隆佛法宗门。”弟子们问：“不知从最初佛祖应身现化以来，已经共计传授了多少代？希望大师给予开示。”","origSents":["问曰：“未知从上佛祖应现已来，传授几代？","愿垂开示。","”"]},{"orig":"师云：“古佛应世，已无数量，不可计也。今以七佛为始，过去庄严劫：毗婆尸佛、尸弃佛、毗舍浮佛。今贤劫：拘留孙佛、拘那含牟尼佛、迦叶佛、释迦文佛，是为七佛。已上七佛，今以释迦文佛首传：第一摩诃迦叶尊者，第二、阿难尊者，第三、商那和修尊者，第四、优波毩多尊者，第五、提多迦尊者，第六、弥遮迦尊者，第七、婆须蜜多尊者，第八、佛驮难提尊者，第九、伏驮蜜多尊者，第十、胁尊者，十一、富那夜奢尊者，十二、马鸣大士，十三、迦毗摩罗尊者，十四、龙树大士，十五、迦那提婆尊者，十六、罗睺罗多尊者，十七、僧伽难提尊者，十八、伽耶舍多尊者，十九、鸠摩罗多尊者，二十、阇耶多尊者，二十一、婆修盘头尊者，二十二、摩拏罗尊者，二十三、鹤勒那尊者，二十四、师子尊者，二十五、婆舍斯多尊者，二十六、不如蜜多尊者，二十七、般若多罗尊者，二十八、菩提达摩尊者，二十九、慧可大师，三十、僧璨大师，三十一、道信大师，三十二、弘忍大师，惠能是为三十三祖。从上诸祖，各有禀承。汝等向后，递代流传，毋令乖误。”","trans":"弟子们问：“不知从最初佛祖应身现化以来，已经共计传授了多少代？希望大师给予开示。”惠能大师说：“从远古的佛应身出世，已经无数无量，不可计算了。现在就以七佛为开始吧，在过去世的庄严劫中：有毗婆尸佛、尸弃佛、毗舍浮佛。今贤劫：拘留孙佛、拘那含牟尼佛、迦叶佛、释迦文佛，这是被称作七佛的。以上的七佛，现在以释迦牟尼佛为首传，依次传递：第一、摩诃迦叶尊者，第二、阿难尊者，第三、商那和修尊者，第四、优波毩多尊者，第五、提多迦尊者，第六、弥遮迦尊者，第七、婆须蜜多尊者，第八、佛驮难提尊者，第九、伏驮蜜多尊者，第十、胁尊者，十一、富那夜奢尊者，十二、马鸣大士，十三、迦毗摩罗尊者，十四、龙树大士，十五、迦那提婆尊者，十六、罗睺罗多尊者，十七、僧伽难提尊者，十八、伽耶舍多尊者，十九、鸠摩罗多尊者，二十、阇耶多尊者，二十一、婆修盘头尊者，二十二、摩拏罗尊者，二十三、鹤勒那尊者，二十四、师子尊者，二十五、婆舍斯多尊者，二十六、不如蜜多尊者，二十七、般若多罗尊者，二十八、菩提达摩尊者，二十九、慧可大师，三十、僧璨大师，三十一、道信大师，三十二、弘忍大师，惠能就是三十三祖。从以上各位祖师，都各有禀受继承。你们今后一代一代的传授流布下去，不要有讹误。”","origSents":["师云：“古佛应世，已无数量，不可计也。","今以七佛为始，过去庄严劫：毗婆尸佛、尸弃佛、毗舍浮佛。","今贤劫：拘留孙佛、拘那含牟尼佛、迦叶佛、释迦文佛，是为七佛。","已上七佛，今以释迦文佛首传：第一摩诃迦叶尊者，第二、阿难尊者，第三、商那和修尊者，第四、优波毩多尊者，第五、提多迦尊者，第六、弥遮迦尊者，第七、婆须蜜多尊者，第八、佛驮难提尊者，第九、伏驮蜜多尊者，第十、胁尊者，十一、富那夜奢尊者，十二、马鸣大士，十三、迦毗摩罗尊者，十四、龙树大士，十五、迦那提婆尊者，十六、罗睺罗多尊者，十七、僧伽难提尊者，十八、伽耶舍多尊者，十九、鸠摩罗多尊者，二十、阇耶多尊者，二十一、婆修盘头尊者，二十二、摩拏罗尊者，二十三、鹤勒那尊者，二十四、师子尊者，二十五、婆舍斯多尊者，二十六、不如蜜多尊者，二十七、般若多罗尊者，二十八、菩提达摩尊者，二十九、慧可大师，三十、僧璨大师，三十一、道信大师，三十二、弘忍大师，惠能是为三十三祖。","从上诸祖，各有禀承。","汝等向后，递代流传，毋令乖误。","”"]},{"orig":"大师先天二年癸丑岁，八月初三日，于国恩寺斋罢，谓诸徒众曰：“汝等各依位坐，吾与汝别。”","trans":"唐玄宗先天二年，八月初三，惠能大师在国恩寺用完斋后，告诉所有弟子门人说：“你们各自按位子坐好，我跟你们道别。”法海说：“大师留下什么教法，让后代愚迷的人们能得以识见佛性？”","origSents":["大师先天二年癸丑岁，八月初三日，于国恩寺斋罢，谓诸徒众曰：“汝等各依位坐，吾与汝别。","”"]},{"orig":"法海白言：“和尚留何教法，令后代迷人得见佛性？”","trans":"法海说：“大师留下什么教法，让后代愚迷的人们能得以识见佛性？”惠能大师说：“你们仔细听好，后代愚迷的人，如果识见众生，就是识见佛性；如果不识见众生，永远寻佛却终难求到。我现在教你们如何识见自心众生，识见自心佛性。要想求得识见佛，只有识见众生，因为是众生不能识见于佛，不是佛不得识见众生。自我本性如果开悟得见，众生都是佛；自我本性如果执迷不悟，那么佛就是众生。自我心性平等无二，众生是佛；自我心性邪恶危险，那么佛是众生。你们的心如果险曲不正，那就是佛沦于众生之中。如果一念平等正直，那就是众生就都成佛了。我的本心中本自有佛，自性之佛才是真佛。自心中如果没有佛心，到那里去求真佛？你们的自己的本心就是佛，不要再怀疑了。自心之外面没有一物能够建立，因为万事万物都是本心所生发。所以佛经中说：‘心生种种法生，心灭种种法灭。’我今天留一个偈，和你们作别，这个偈叫做自性真佛偈。后代的人识见这个偈的真意，自己识见本心，自我成就佛道。”偈中说道：","origSents":["法海白言：“和尚留何教法，令后代迷人得见佛性？","”"]},{"orig":"师言：“汝等谛听，后代迷人，若识众生，即是佛性；若不识众生，万劫觅佛难逢。吾今教汝识自心众生，见自心佛性。欲求见佛，但识众生，只为众生迷佛，非是佛迷众生。自性若悟，众生是佛；自性若迷，佛是众生。自性平等，众生是佛；自性邪险，佛是众生。汝等心若险曲，即佛在众生中。一念平直，即是众生成佛。我心自有佛，自佛是真佛。自若无佛心，何处求真佛？汝等自心是佛，更莫狐疑。外无一物而能建立，皆是本心生万种法。故经云：‘心生种种法生，心灭种种法灭。’吾今留一偈，与汝等别，名自性真佛偈。”后代之人，识此偈意，自见本心，自成佛道。”偈曰：","trans":"惠能大师说：“你们仔细听好，后代愚迷的人，如果识见众生，就是识见佛性；如果不识见众生，永远寻佛却终难求到。我现在教你们如何识见自心众生，识见自心佛性。要想求得识见佛，只有识见众生，因为是众生不能识见于佛，不是佛不得识见众生。自我本性如果开悟得见，众生都是佛；自我本性如果执迷不悟，那么佛就是众生。自我心性平等无二，众生是佛；自我心性邪恶危险，那么佛是众生。你们的心如果险曲不正，那就是佛沦于众生之中。如果一念平等正直，那就是众生就都成佛了。我的本心中本自有佛，自性之佛才是真佛。自心中如果没有佛心，到那里去求真佛？你们的自己的本心就是佛，不要再怀疑了。自心之外面没有一物能够建立，因为万事万物都是本心所生发。所以佛经中说：‘心生种种法生，心灭种种法灭。’我今天留一个偈，和你们作别，这个偈叫做自性真佛偈。后代的人识见这个偈的真意，自己识见本心，自我成就佛道。”偈中说道：真如自性是真佛，邪见三毒是魔王。","origSents":["师言：“汝等谛听，后代迷人，若识众生，即是佛性；","若不识众生，万劫觅佛难逢。","吾今教汝识自心众生，见自心佛性。","欲求见佛，但识众生，只为众生迷佛，非是佛迷众生。","自性若悟，众生是佛；","自性若迷，佛是众生。","自性平等，众生是佛；","自性邪险，佛是众生。","汝等心若险曲，即佛在众生中。","一念平直，即是众生成佛。","我心自有佛，自佛是真佛。","自若无佛心，何处求真佛？","汝等自心是佛，更莫狐疑。","外无一物而能建立，皆是本心生万种法。","故经云：‘心生种种法生，心灭种种法灭。","’吾今留一偈，与汝等别，名自性真佛偈。","”后代之人，识此偈意，自见本心，自成佛道。","”偈曰："]},{"orig":"真如自性是真佛，邪见三毒是魔王。","trans":"真如自性是真佛，邪见三毒是魔王。邪迷之时魔在舍，正见之时佛在堂。","origSents":["真如自性是真佛，邪见三毒是魔王。"]},{"orig":"邪迷之时魔在舍，正见之时佛在堂。","trans":"邪迷之时魔在舍，正见之时佛在堂。性中邪见三毒生，即是魔王来住舍。","origSents":["邪迷之时魔在舍，正见之时佛在堂。"]},{"orig":"性中邪见三毒生，即是魔王来住舍。","trans":"性中邪见三毒生，即是魔王来住舍。正见自除三毒心，魔变成佛真无假。","origSents":["性中邪见三毒生，即是魔王来住舍。"]},{"orig":"正见自除三毒心，魔变成佛真无假。","trans":"正见自除三毒心，魔变成佛真无假。法身报身及化身，三身本来是一身。","origSents":["正见自除三毒心，魔变成佛真无假。"]},{"orig":"法身报身及化身，三身本来是一身。","trans":"法身报身及化身，三身本来是一身。若向性中能自见，即是成佛菩提因。","origSents":["法身报身及化身，三身本来是一身。"]},{"orig":"若向性中能自见，即是成佛菩提因。","trans":"若向性中能自见，即是成佛菩提因。本从化身生净性，净性常在化身中。","origSents":["若向性中能自见，即是成佛菩提因。"]},{"orig":"本从化身生净性，净性常在化身中。","trans":"本从化身生净性，净性常在化身中。性使化身行正道，当来圆满真无穷。","origSents":["本从化身生净性，净性常在化身中。"]},{"orig":"性使化身行正道，当来圆满真无穷。","trans":"性使化身行正道，当来圆满真无穷。淫性本是净性因，除淫即是净性身。","origSents":["性使化身行正道，当来圆满真无穷。"]},{"orig":"淫性本是净性因，除淫即是净性身。","trans":"淫性本是净性因，除淫即是净性身。性中各自离五欲，见性刹那即是真。","origSents":["淫性本是净性因，除淫即是净性身。"]},{"orig":"性中各自离五欲，见性刹那即是真。","trans":"性中各自离五欲，见性刹那即是真。今生若遇顿教门，忽悟自性见世尊。","origSents":["性中各自离五欲，见性刹那即是真。"]},{"orig":"今生若遇顿教门，忽悟自性见世尊。","trans":"今生若遇顿教门，忽悟自性见世尊。若欲修行觅作佛，不知何处拟求真？","origSents":["今生若遇顿教门，忽悟自性见世尊。"]},{"orig":"若欲修行觅作佛，不知何处拟求真？","trans":"若欲修行觅作佛，不知何处拟求真？若能心中自见真，有真即是成佛因。","origSents":["若欲修行觅作佛，不知何处拟求真？"]},{"orig":"若能心中自见真，有真即是成佛因。","trans":"若能心中自见真，有真即是成佛因。不见自性外觅佛，起心总是大痴人。","origSents":["若能心中自见真，有真即是成佛因。"]},{"orig":"不见自性外觅佛，起心总是大痴人。","trans":"不见自性外觅佛，起心总是大痴人。顿教法门今已留，救度世人须自修，","origSents":["不见自性外觅佛，起心总是大痴人。"]},{"orig":"顿教法门今已留，救度世人须自修，","trans":"顿教法门今已留，救度世人须自修，报汝当来学道者，不作此见大悠悠。","origSents":["顿教法门今已留，救度世人须自修，"]},{"orig":"报汝当来学道者，不作此见大悠悠。","trans":"报汝当来学道者，不作此见大悠悠。师说偈已，告曰：“汝等好住，吾灭度后，莫作世情悲泣雨泪，受人吊问，身著孝服，非吾弟子，亦非正法。但识自本心，见自本性，无动无静，无生无灭，无去无来，无是无非，无住无往。恐汝等心迷，不会吾意，今再嘱汝，令汝见性。吾灭度后，依此修行，如吾在日。若违吾教，纵吾在世，亦无有益。”复说偈曰：","origSents":["报汝当来学道者，不作此见大悠悠。"]},{"orig":"兀兀不修善，腾腾不造恶，","trans":"惠能大师说完偈以后，告诉大家：“你们住留世间、好好珍重，我去世之后，不要像世间人那样的悲伤哭泣，泪如雨下，接受别人的吊唁慰问，身穿孝服，这样不是我的弟子，也不合真正的佛法。只要识见自我本心本性，没有动也没有静，没有生起也没有毁灭，没有来也没有去，没有是也没有非，没有住也没有往。我担心你们迷误，不能体会我的真意，现在再次叮嘱你们，让你们识见本心。我去世后，依照这个修行，就好像我在的时候一样。如果违背了我的教法，纵然我在世，也没有什么益处。”再说偈：兀兀不修善，腾腾不造恶，","origSents":["兀兀不修善，腾腾不造恶，"]},{"orig":"寂寂断见闻，荡荡心无著。","trans":"兀兀不修善，腾腾不造恶，寂寂断见闻，荡荡心无著。","origSents":["寂寂断见闻，荡荡心无著。"]},{"orig":"师说偈已，端坐至三更，忽谓门人曰：“吾行矣！”奄然迁化。","trans":"寂寂断见闻，荡荡心无著。惠能大师说完偈以后，端坐着直到三更天，忽然告诉弟子门人说：“我去了！”便溘然长逝。","origSents":["师说偈已，端坐至三更，忽谓门人曰：“吾行矣！","”奄然迁化。"]},{"orig":"于时异香满室，白虹属地，林木变白，禽兽哀鸣。","trans":"惠能大师说完偈以后，端坐着直到三更天，忽然告诉弟子门人说：“我去了！”便溘然长逝。当时奇异的香味溢满室内，一道白虹接天贯地，山林树木霎时变白，禽鸟野兽鸣叫哀嚎。","origSents":["于时异香满室，白虹属地，林木变白，禽兽哀鸣。"]},{"orig":"十一月，广、韶、新三郡官僚，洎门人僧俗，争迎真身，莫决所之。乃焚香祷曰：香烟指处，师所归焉。","trans":"十一月，广州、韶州、新州三州的官员僚属，以及惠能的门人弟子、僧人、俗人，都争着要迎取惠能大师的真身回去供奉，一时间不能决定给谁。于是就烧香祷告说道：香的烟所飘向的地方就是惠能大师所要归去的处所。当时香烟直飘往曹溪山的方向。","origSents":["十一月，广、韶、新三郡官僚，洎门人僧俗，争迎真身，莫决所之。","乃焚香祷曰：香烟指处，师所归焉。"]},{"orig":"时香烟直贯曹溪。","trans":"当时香烟直飘往曹溪山的方向。十一月十三日，惠能大师的神位遗体以及所传下来的衣钵都被搬迁回了曹溪山。","origSents":["时香烟直贯曹溪。"]},{"orig":"十一月十三日，迁神龛并所传衣钵而回。","trans":"十一月十三日，惠能大师的神位遗体以及所传下来的衣钵都被搬迁回了曹溪山。第二年七月，惠能大师的肉身遗体被搬出神龛，弟子方辩用香泥包裹了遗体。弟子门人想着有人要盗取惠能大师首级的事情，于是便先用薄铁片和漆布，加固保护惠能大师的脖子，然后才请入墓塔内。忽然墓塔里面有白色光芒出现，直接冲上天空，三天后才散去。","origSents":["十一月十三日，迁神龛并所传衣钵而回。"]},{"orig":"次年七月出龛，弟子方辩以香泥上之。","trans":"弟子门人想着有人要盗取惠能大师首级的事情，于是便先用薄铁片和漆布，加固保护惠能大师的脖子，然后才请入墓塔内。忽然墓塔里面有白色光芒出现，直接冲上天空，三天后才散去。韶州刺史将惠能大师的事迹上奏皇上后，奉命给惠能大师树立石碑，以纪录大师道行。大师享年七十六，二十四岁得传法衣，三十九岁剃度出家，讲说佛法，惠施众生，共三十七年。得到大师亲传的弟子四十三人，因大师指点悟道超离凡尘的人不计其数。达摩大师所传的表信袈裟，唐中宗所赐予的磨衲袈裟和水晶钵，以及方辩为惠能大师所塑的真相以及佛法用具等等，永远镇守宝林寺道场。《法宝坛经》广为流布，显扬顿教宗门旨意，兴盛昌隆佛、法、僧三宝，普遍利化一切众生。","origSents":["次年七月出龛，弟子方辩以香泥上之。"]},{"orig":"门人忆念取首之记，仍以铁叶漆布，固护师颈入塔；忽于塔内白光出现，直上冲天，三日始散。","trans":"韶州刺史将惠能大师的事迹上奏皇上后，奉命给惠能大师树立石碑，以纪录大师道行。大师享年七十六，二十四岁得传法衣，三十九岁剃度出家，讲说佛法，惠施众生，共三十七年。得到大师亲传的弟子四十三人，因大师指点悟道超离凡尘的人不计其数。达摩大师所传的表信袈裟，唐中宗所赐予的磨衲袈裟和水晶钵，以及方辩为惠能大师所塑的真相以及佛法用具等等，永远镇守宝林寺道场。《法宝坛经》广为流布，显扬顿教宗门旨意，兴盛昌隆佛、法、僧三宝，普遍利化一切众生。Table of Contents","origSents":["门人忆念取首之记，仍以铁叶漆布，固护师颈入塔；","忽于塔内白光出现，直上冲天，三日始散。"]},{"orig":"韶州奏闻，奉敕立碑，纪师道行。师春秋七十有六，年二十四传衣，三十九祝发，说法利生，三十七载。嗣法四十三人，悟道超凡者莫知其数。达摩所传信衣，中宗赐磨衲宝钵，及方辩塑师真相，并道具，永镇宝林道场。留传《坛经》，以显宗旨，兴隆三宝，普利群生者。","trans":"Table of Contents前言","origSents":["韶州奏闻，奉敕立碑，纪师道行。","师春秋七十有六，年二十四传衣，三十九祝发，说法利生，三十七载。","嗣法四十三人，悟道超凡者莫知其数。","达摩所传信衣，中宗赐磨衲宝钵，及方辩塑师真相，并道具，永镇宝林道场。","留传《坛经》，以显宗旨，兴隆三宝，普利群生者。"]}]}];

          pp.origSents.forEach(function(sent) {
            var span = document.createElement('span');
            span.className = 'orig-sent';
            span.textContent = sent;

            span.addEventListener('click', function(e) {
              e.stopPropagation();

              // Remove active from all sentences in this group
              var allSents = group.querySelectorAll('.orig-sent');
              for (var k = 0; k < allSents.length; k++) {
                allSents[k].classList.remove('active');
              }
              span.classList.add('active');

              // Reveal translation
              var wasRevealed = group.classList.contains('revealed');
              // Close all other groups in this chapter
              var allGroups = section.querySelectorAll('.para-group');
              for (var g = 0; g < allGroups.length; g++) {
                allGroups[g].classList.remove('revealed');
                var sents = allGroups[g].querySelectorAll('.orig-sent');
                for (var s = 0; s < sents.length; s++) {
                  sents[s].classList.remove('active');
                }
              }
              if (!wasRevealed) {
                group.classList.add('revealed');
                span.classList.add('active');
                // Scroll to the group
                setTimeout(function() {
                  group.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 80);
              }
            });

            origBlock.appendChild(span);
          });
        } else {
          origBlock.textContent = pp.orig;
        }

        // Translation block
        var transBlock = document.createElement('div');
        transBlock.className = 'trans-block';

        var transLabel = document.createElement('div');
        transLabel.className = 'trans-label';
        transLabel.textContent = '【译文】';

        var transText = document.createElement('div');
        transText.className = 'trans-text';
        transText.textContent = pp.trans;

        transBlock.appendChild(transLabel);
        transBlock.appendChild(transText);

        group.appendChild(origBlock);
        group.appendChild(transBlock);
        section.appendChild(group);
      });
    }

    main.appendChild(section);
  });

  // Back to top
  var backBtn = document.getElementById('back-to-top');
  window.addEventListener('scroll', function() {
    if (window.scrollY > 400) backBtn.classList.add('visible');
    else backBtn.classList.remove('visible');
  });
  backBtn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // Active nav
  var navLinks = document.querySelectorAll('nav a');
  window.addEventListener('scroll', function() {
    var current = -1;
    CHAPTERS.forEach(function(ch, i) {
      var el = document.getElementById('chapter-' + i);
      if (el && el.getBoundingClientRect().top <= 200) current = i;
    });
    navLinks.forEach(function(a, i) {
      if (i === current) a.classList.add('active');
      else a.classList.remove('active');
    });
  });
})();
</script>
</body>
</html>
